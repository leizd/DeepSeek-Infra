  <g font-size="10.5" fill="#78350f">
    <text x="844" y="260" font-weight="600">网关请求预处理</text>
    <text x="844" y="274" font-size="9" fill="#b45309">POST /gateway/request/prepare</text>
    <text x="844" y="292" font-weight="600">MCP 协议预处理</text>
    <text x="844" y="306" font-size="9" fill="#b45309">POST /mcp/request/prepare</text>
    <text x="844" y="324" font-weight="600">工具策略评估</text>
    <text x="844" y="338" font-size="9" fill="#b45309">POST /policy/{url,path,capability}</text>
    <text x="844" y="356" font-weight="600">RAG 向量排序 · JSON / 紧凑二进制</text>
    <text x="844" y="370" font-size="8.5" fill="#b45309">POST /rag/vectors/rank · POST /rag/vectors/rank-binary</text>
    <text x="844" y="388" font-weight="600">RAG 文档预处理 &amp; 差分分块</text>
    <text x="844" y="402" font-size="8.5" fill="#b45309">POST /rag/documents/prepare · scan-batch · age crypto</text>
  </g>

  <!-- optional stateless mcp plane -->
  <rect x="824" y="428" width="328" height="130" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-dasharray="6 4"/>
  <rect x="824" y="428" width="5" height="130" rx="2.5" fill="#a855f7"/>
  <text x="844" y="452" font-size="14" font-weight="700" fill="#6b21a8">可选 无状态 MCP 执行平面</text>
