    <text x="194" y="693" font-size="9.5" fill="#64748b">事件溯源日志 · 节点状态机 · 断点续跑</text>

    <rect x="336" y="660" width="260" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="466" y="677" fill="#1d4ed8" font-weight="600">加密容灾备份 (.backups)</text>
    <text x="466" y="693" font-size="9.5" fill="#2563eb">Object Set v1 · Age 密文 · 投影式恢复</text>

    <rect x="608" y="660" width="260" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
