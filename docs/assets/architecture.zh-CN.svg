  <rect x="1070" y="34" width="82" height="28" rx="14" fill="#2563eb"/>
  <text x="1111" y="53" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">v4.7.4</text>

  <!-- clients layer -->
  <rect x="48" y="98" width="1104" height="68" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="115" font-size="9.5" letter-spacing="1.5" fill="#94a3b8">客户端 · REACT 前端 &amp; 标准协议接入</text>
  <g font-size="11.5" fill="#334155" text-anchor="middle">
    <rect x="64" y="122" width="138" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="133" y="142">React 应用 · /</text>
