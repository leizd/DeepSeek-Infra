    <rect x="804" y="122" width="156" height="32" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="882" y="142" fill="#1d4ed8">MCP 客户端 → /mcp</text>
    <rect x="968" y="122" width="168" height="32" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="1052" y="142" fill="#1d4ed8">A2A 节点 → /a2a</text>
  </g>

  <!-- arrow clients -> runtime -->
  <line x1="600" y1="166" x2="600" y2="190" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="616" y="183" font-size="10.5" fill="#94a3b8">HTTP · SSE 流式传输 · JSON-RPC 2.0 · 标准 OpenAI / MCP / A2A 协议</text>

  <!-- python default runtime -->
  <rect x="48" y="194" width="760" height="364" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="48" y="194" width="6" height="364" rx="3" fill="#2563eb"/>
  <text x="72" y="222" font-size="17" font-weight="700" fill="#1e40af">Python 默认运行时</text>
  <text x="72" y="240" font-size="11" fill="#3b82f6">FastAPI / ASGI — 权威运行时 · 默认部署：纯 Python · 本地安全沙箱</text>

  <!-- python columns -->
  <g font-size="11.5" fill="#1e3a8a">
    <!-- Col 1: Gateway & Agent -->
    <text x="72" y="266" font-weight="700" fill="#1e40af">网关与 Agent 运行时</text>
    <text x="72" y="288">• 身份认证 · 变异保护 (Mutation Gate)</text>
    <text x="72" y="308">• HTTP / SSE / 流式响应</text>
    <text x="72" y="328">• 策略驱动模型路由器 (Model Router)</text>
    <text x="72" y="348">• Context Engine (前缀缓存优化)</text>
    <text x="72" y="368">• Context Taint 注入防火墙</text>
    <text x="72" y="388">• Agent DAG 编排 (Leader/Worker/Critic)</text>
    <text x="72" y="408">• Agent Runs 事件溯源持久化</text>
    <text x="72" y="428">• A2A Agent 网格 &amp; 任务生命周期</text>
    <text x="72" y="448">• 请求调度队列 · DLQ · Token 预算</text>

    <!-- Col 2: Tools, RAG, Workspace & DR -->
    <text x="360" y="266" font-weight="700" fill="#1e40af">能力与本地数据平面</text>
    <text x="360" y="288">• 真实工具执行 (17+ 本地沙箱工具)</text>
    <text x="360" y="308">• Capability-based Tool Policy 引擎</text>
    <text x="360" y="328">• MCP Server 传输、资源与会话</text>
    <text x="360" y="348">• 本地 RAG (BM25 + 向量混合检索)</text>
    <text x="360" y="368">• 文档解析 · PDF 逐页渲染 · OCR</text>
    <text x="360" y="388">• Workspace Core (Projects / Artifacts)</text>
    <text x="360" y="408">• Automation 自动化引擎 &amp; Browser 控制</text>
    <text x="360" y="428">• Skills 动态沙箱、版本化与评估</text>
    <text x="360" y="448">• Object Set v1 加密容灾与 Merkle 校验</text>
    <text x="360" y="468">• OpenTelemetry 链路追踪 · /metrics 探针</text>
  </g>

  <!-- optional rust sidecar -->
  <rect x="824" y="194" width="328" height="224" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-dasharray="6 4"/>
