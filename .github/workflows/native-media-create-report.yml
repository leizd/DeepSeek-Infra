name: Read completed native creation reports
'on':
  push:
    branches: [codex/native-create-report-*]
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original archive and return bounded report fields
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/relay_native_create_reports.py
