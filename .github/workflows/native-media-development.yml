name: Native media development checks

on:
  push:
    branches: ["codex/rust-cloud/media-patch-*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: native-media-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  media-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
      MEDIA_GO_TEST_PATTERN: "^(TestMedia.*|TestFlatPatch.*|TestActionAdmissionV4UpgradePreservesHistoryAndRollsBackOnFailure|TestActionReconciliationMigrationDoesNotLegalizeOldStateEdges|TestActionReconciliationV5UnknownTakeoverStillResolves|TestActionReconciliationV5UpgradePreservesHistory|TestActionVerificationUpgradeDoesNotLegalizePreV7Phases|TestActionVerificationV6UpgradeIsAtomicAndPreservesRecovery|TestControlAuthorityV7UpgradeIsAtomicAndPreservesHistory|TestControlMigratesFromV2ToOperationJournal|TestControlRPCRejectsDuplicateCredentialsAndOversizedMessages|TestCutoverJournalRejectsMutationAndControlMigratesFromV1|TestNativeOriginV18MigrationFaultRetainsOriginalSignedStore|TestOperationStatusV8UpgradePreservesTheJournal|TestReconcilingInvariantV5IllegalEdgeStaysIllegal|TestStorageDispatchV3UpgradePreservesHistoryAndFailedClaim|TestV10InventoryMigrationRetainsShadowHistoryWithoutForgingAttestation|TestV11StoreMigratesToTheHandbackSchemaWithoutInventingHistory|TestV12ImportMigratesWithoutInventingLiveSourceBinding|TestV12PromotedImportCannotUpgradeWithoutLiveSourceBinding|TestV14MigrationPreservesOlderRecordsWithoutInventingHealth|TestV15MigrationPreservesRecordsAndVerifiesTheJournal|TestV16CancellationMigrationPreservesActiveLeaseAndImmutableHistory|TestV16StoreOpenMigratesFailureLeaseAndPreservesOriginalCustody|TestV17FailureMigrationPreservesRowsThenSettlesVerifiedPhase|TestV9UnsignedPromotionHistoryCannotBeUpgradedAsSigned|TestTargetDeleteContract.*|TestTargetActivateContract.*)$"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install the original checksum-pinned Go
        run: |
          archive="$RUNNER_TEMP/go1.27.1.linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" https://go.dev/dl/go1.27.1.linux-amd64.tar.gz
          echo "63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/media-go"
          tar -xzf "$archive" -C "$RUNNER_TEMP/media-go"
          echo "$RUNNER_TEMP/media-go/go/bin" >> "$GITHUB_PATH"
      - name: Run media admission, proof, HTTP and transport regressions
        timeout-minutes: 12
        run: "mkdir -p artifacts/native-media-development\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\ntest -z \"$(git status --porcelain=v1 --untracked-files=all)\"\nset +e\npython scripts/run_native_target_development.py --pattern \"$MEDIA_GO_TEST_PATTERN\" --out artifacts/native-media-development\ntest_status=$?\nset -e\nexport MEDIA_GO_STATUS=\"$test_status\"\npython - <<'PY'\nimport hashlib, json, os, re, subprocess\nfrom pathlib import Path\nexpected = set()\nfor package in [\"media\", \"store\", \"api\", \"worker\"]:\n    for path in (Path(\"go/internal\") / package).glob(\"*_test.go\"):\n        expected.update(n for n in re.findall(r\"^func (Test\\w*)\\(\", path.read_text(), re.M) if re.fullmatch(os.environ[\"MEDIA_GO_TEST_PATTERN\"],n))\nrequired_legacy = {'TestV15MigrationPreservesRecordsAndVerifiesTheJournal', 'TestV14MigrationPreservesOlderRecordsWithoutInventingHealth', 'TestControlMigratesFromV2ToOperationJournal', 'TestCutoverJournalRejectsMutationAndControlMigratesFromV1', 'TestActionAdmissionV4UpgradePreservesHistoryAndRollsBackOnFailure', 'TestActionReconciliationV5UpgradePreservesHistory', 'TestControlRPCRejectsDuplicateCredentialsAndOversizedMessages', 'TestNativeOriginV18MigrationFaultRetainsOriginalSignedStore', 'TestV10InventoryMigrationRetainsShadowHistoryWithoutForgingAttestation', 'TestActionReconciliationV5UnknownTakeoverStillResolves', 'TestOperationStatusV8UpgradePreservesTheJournal', 'TestActionVerificationUpgradeDoesNotLegalizePreV7Phases', 'TestV16CancellationMigrationPreservesActiveLeaseAndImmutableHistory', 'TestReconcilingInvariantV5IllegalEdgeStaysIllegal', 'TestV16StoreOpenMigratesFailureLeaseAndPreservesOriginalCustody', 'TestV11StoreMigratesToTheHandbackSchemaWithoutInventingHistory', 'TestActionVerificationV6UpgradeIsAtomicAndPreservesRecovery', 'TestStorageDispatchV3UpgradePreservesHistoryAndFailedClaim', 'TestV12PromotedImportCannotUpgradeWithoutLiveSourceBinding', 'TestControlAuthorityV7UpgradeIsAtomicAndPreservesHistory', 'TestV17FailureMigrationPreservesRowsThenSettlesVerifiedPhase', 'TestActionReconciliationMigrationDoesNotLegalizeOldStateEdges', 'TestV12ImportMigratesWithoutInventingLiveSourceBinding', 'TestV9UnsignedPromotionHistoryCannotBeUpgradedAsSigned'}\nrequired_media = {'TestMediaAdmissionSerializesTheLibraryAndRetainsOriginalIdentity', 'TestMediaCallsRequireTheProductionSecuredWorkerChannel', 'TestMediaControlRPCDispatchAndSignedSettlementRetainReplayIdentity', 'TestMediaControlRPCLargeTypedClaimRetainsTheOriginalLegacyMessageLimit', 'TestMediaControlRPCRefusesBothMutationMethodsWithoutAuthority', 'TestMediaDigestBindsPresenceAndEveryIntentField', 'TestMediaDigestRejectsUnknownFieldsInvalidUTF8AndOversizedMessages', 'TestMediaDispatchRejectsStaleClaimsAndNeverReissuesAFreshPermit', 'TestMediaForwardingPreservesTheOriginalOperationAndTransportErrors', 'TestMediaForwardingRejectsConflictingCredentialsBeforeCallingThePeer', 'TestMediaLegacyReadRPCStillDefaultsToShadowAndRejectsMalformedSnapshots', 'TestMediaNestedMalformedValuesCannotBypassTheTypedBoundary', 'TestMediaOutcomeRejectsMalformedAppliedObjectsAndRefusalEncoding', 'TestMediaPreparedRefusalCanSettleWithoutInventingADispatch', 'TestMediaPublicClosedControlAndMalformedReplyRetainUncertainty', 'TestMediaPublicForgedTLSResultCannotSettleTheClaim', 'TestMediaPublicIngressKeepsHostPathAndFlatPatchFieldPresenceChecks', 'TestMediaPublicLostTLSReplyQueriesTheOriginalWithoutRedispatch', 'TestMediaPublicPatchKeepsAuthenticationAuthorityAndBodyRefusals', 'TestMediaPublicTLSRefusalRetainsTheOriginalHTTPErrorAndReleasesAdmission', 'TestMediaPublicTLSRoundTripSettlesOnlyTheBoundSignedOutcome', 'TestMediaPublicUnresolvedTLSReplyBlocksAnotherOperationDespiteAbsence', 'TestMediaRPCDoesNotAcceptAnUnauthoritativeOrUnboundRequest', 'TestMediaRecoveryCancelsOnlyDurableUndispatchedAbsence', 'TestMediaRecoveryKeepsQueryFailuresAndIncompleteRepliesUnknown', 'TestMediaSignedHistoricalOutcomeSettlesAfterExpiryAndCannotBeChanged', 'TestMediaSignedOutcomeCannotRebindAnOperationOrRealm', 'TestMediaStoreCorruptIntentParsingCannotEscapeItsOriginalTransaction', 'TestMediaStoreMalformedSignerCannotSettleOrRetireHistory', 'TestMediaStoreMissingRecordsNeverInventAClaimOrSettlement', 'TestMediaStorePublicAdmissionRejectsPersistedDigestCorruption', 'TestMediaStoreShortLeaseExpiresWithoutReissuingAnOperation', 'TestMediaStoreSignedOutcomeMustFitTheBoundIncludingItsSignature', 'TestMediaStoreUnavailableAndLostWriterFailBeforeAdmission', 'TestMediaStoreWriteAbortRollsBackTheClaimAndRetainsOnlyOnePermit', 'TestMediaValuesRejectAmbiguousOrMalformedWireValues', 'TestMediaValuesRetainNullNumbersNestedArraysAndUnicode'}\nrequired_lossless_patch = {'TestMediaServerErrorOutcomeKeepsAppliedAndRefusedEffectsDistinct', 'TestMediaServerErrorOutcomeRejectsReboundOrAmbiguousSignedEffects', 'TestMediaServerErrorOutcomeRequiresOriginalClaimEncodingAndSigningDomain', 'TestFlatPatchInputRetainsEscapesAndScalarKinds', 'TestFlatPatchWireRejectsNoncanonicalEncodingAndInvalidScalarNodes', 'TestFlatPatchHTTPUsesTheOriginalAppliedRecordAfterFreshAndLostReplies', 'TestFlatPatchSyntaxRetainsDiagnosticsAfterEmptyContainersAndDecimals', 'TestMediaPublicPatchBodyFailureAndCrossMethodReceiptRemainClosed', 'TestFlatPatchBindsCapabilityPreparationCodecAndSigningDomain', 'TestFlatPatchInputKeepsTheOriginalOneMegabyteBound', 'TestFlatPatchInputPreservesDeepDecimalsNonfiniteAndUTF16', 'TestFlatPatchInputPrunesOverwrittenAndUnsupportedValues', 'TestFlatPatchInputRejectsInvalidBodyBeforeAdmittingAnOperation', 'TestFlatPatchKeepsOrderInLegacyResponseValues', 'TestFlatPatchPreservesDeepObjectsOrderAndExactNumbers', 'TestFlatPatchRejectsInvalidTypedTreesBeforeReturningJSON', 'TestFlatPatchSyntaxMatchesOriginalDiagnostics', 'TestMediaPublicTLSSeparatesTheTwoSignedServerErrorEffects'}\nrequired_target_delete = {'TestTargetDeleteContractRequiresOriginalSuccessAndJournalledAbsence', 'TestTargetDeleteContractKeepsClosedAndUnsupportedPathsFailClosed', 'TestTargetDeleteContractDatabaseInterruptionsCannotPartiallyCommit', 'TestTargetDeleteContractInvalidScopeAndCorruptPayloadFailClosed', 'TestTargetDeleteContractDeletesRetainedStatesWithoutChangingHealth', 'TestTargetDeleteContractSerializesConcurrentPublicTCPRequests', 'TestTargetDeleteContractBindsDurableOperationAcrossReopenAndReplay', 'TestTargetDeleteContractRollsBackWhenWriterExpiresBeforeCommit', 'TestTargetDeleteContractKeepsMissingTargetsAsNotFound', 'TestTargetDeleteContractRequiresAuthenticationHostAndNativeAuthority'}\nrequired_target_activate = {'TestTargetActivateContractPreservesOriginalDocumentAndClearsDrainFields', 'TestTargetActivateContractKeeps404AndOwnershipAdmissions', 'TestTargetActivateContractDatabaseInterruptionsRollbackAndReplayStayClosed', 'TestTargetActivateContractJournalsOriginalDocumentAcrossReopenAndLaterMutations', 'TestTargetActivateContractRejectsAbsentCorruptAndMisboundReceipts', 'TestTargetActivateContractSerializesConcurrentPublicTCPRequests', 'TestTargetActivateContractWriterExpiryCannotCommitOrRebindReplay', 'TestTargetActivateContractRequiresTheCurrentWriter'}\nrequired_ordered = {'TestMediaOrderedJSONBindsInputPositionsAndPreservesLegacyWire', 'TestMediaOrderedJSONFitsLargestPermittedPublicScalarArray', 'TestMediaOrderedJSONPreservesDuplicateFirstPositionAndRejectsMalformedInput', 'TestMediaOrderedJSONRejectsMalformedOrdinalSets', 'TestMediaOrderedJSONRetainsCanonicalKeysAndOriginalPositions'}\nrequired_capacity = {'TestMediaCapacityLargestLegalIntentSurvivesAdmissionAndReopen', 'TestMediaCapacityMigrationRefusesTamperedHistoryAndRetirement', 'TestMediaCapacityMigrationRollbackRetainsExactV19Store', 'TestMediaCapacityV19UpgradeRetainsRowsAndUncertainBarrier', 'TestMediaCapacityV20SQLRetainsExactBoundsAndImmutability'}\nrequired_recovery = {'TestMediaRecoveryDriverAbsenceAndInvalidEvidenceRetainTheBarrier', 'TestMediaRecoveryDriverCancellationDrainsTheQueryAndClosesItsClient', 'TestMediaRecoveryDriverEmptyAndClosedStoresDoNotDialAndTicksCancel', 'TestMediaRecoveryDriverSignedRefusalSettlesWithoutDispatch', 'TestMediaRecoveryDriverSkipsLiveClaimsAndRetiresOnlyExpiredUndispatchedAbsence', 'TestMediaRecoveryDriverStartsOnlyInTheNativeAuthoritativeLifecycle', 'TestMediaRecoveryDriverSuccessorSettlesOriginalWithoutRedispatch', 'TestMediaRecoveryMetadataSelectsExpiryWithoutChangingTheClaim', 'TestMediaRecoveryMetadataSelectsHistoricalWriterBeforeOriginalExpiry', 'TestMediaRecoveryMetadataSkipsPayloadDecodingUntilRecoveryIsEligible'}\nrequired_delete = {'TestMediaDeleteIntentCannotCarryPatchOrUnknownKind', 'TestMediaDeleteSignedCountsCannotRebindPatchOrRefusal', 'TestMediaPublicDeleteAdmission', 'TestMediaPublicDeleteTLSKeepsCountsSignedIdentityAndUnknownReservation', 'TestMediaLegacyPatchCanonicalBytesRetainDefaultKind'}\nrequired_create = {'TestMediaCreateManifestBindsContentWithoutExpandingControlRows', 'TestMediaCreateSignedResultRequiresOriginalDigestFenceAndShape', 'TestMediaCreationContentRequiresPinnedTLSAndServiceIdentity', 'TestMediaPublicCreateAdmission', 'TestMediaCreateForwarding', 'TestMediaCreateClientBoundedMessages', 'TestMediaPublicCreateTLS', 'TestMediaPublicCreateInputBounds', 'TestMediaMultipartParser', 'TestMediaMultipartFormCodecs', 'TestMediaMultipartPublicTLS'}\nrequired_process = {'TestMediaProcessClientRetainsOperationAndNeverRetriesTransportFailure', 'TestMediaProcessOptionsPreserveEmptyBodyTruthTokensAndCorrelation', 'TestMediaProcessRequestBindsOptionsAndSeparatesMutationKinds', 'TestMediaProcessResultRequiresBoundRecordSegmentsCountAndOriginalFence', 'TestMediaProcessSignedResultBindsSegmentsAndRejectsCrossKindResults', 'TestMediaPublicProcessAdmissionRejectsUnboundRequestsBeforeCreatingOperations', 'TestMediaPublicProcessSettlesPendingOriginalBeforeAnotherExplicitRequest', 'TestMediaPublicProcessTLSBindsResultsAndRecoversOnlyTheOriginalOperation'}\nassert (required_legacy | required_media | required_ordered | required_capacity | required_recovery | required_delete | required_create | required_process | required_lossless_patch | required_target_delete | required_target_activate) == expected\nstarted, finished, packages = {}, {}, {}\nfor line in Path(\"artifacts/native-media-development/go-tests.jsonl\").read_text().splitlines():\n    try: row = json.loads(line)\n    except json.JSONDecodeError: continue\n    name, action = row.get(\"Test\"), row.get(\"Action\")\n    if name in expected and action == \"run\": started[name] = started.get(name, 0) + 1\n    if name in expected and action in {\"pass\", \"fail\", \"skip\"}:\n        assert name not in finished\n        finished[name] = action\n    if not name and action in {\"pass\", \"fail\", \"skip\"}: packages[row[\"Package\"]] = action\ncode = int(os.environ[\"MEDIA_GO_STATUS\"])\ngrouped = json.loads(Path(\"artifacts/native-media-development/grouped-run.json\").read_bytes())\nassert grouped[\"schema\"] == \"native-target-development-groups-v1\" and grouped[\"raceEnabled\"]\nassert grouped[\"perInvocationTimeout\"] == \"8m\" and set(grouped[\"expectedTests\"]) == expected\nassert [g[\"name\"] for g in grouped[\"groups\"]] == [\"retained\", \"activation\"]\nflattened = [name for g in grouped[\"groups\"] for name in g[\"expectedTests\"]]\nassert len(flattened) == len(expected) and set(flattened) == expected\nassert all(not n.startswith(\"TestTargetActivateContract\") for n in grouped[\"groups\"][0][\"expectedTests\"])\nassert all(n.startswith(\"TestTargetActivateContract\") for n in grouped[\"groups\"][1][\"expectedTests\"])\njoined = b\"\"\nfor group in grouped[\"groups\"]:\n    assert group[\"raceEnabled\"] and group[\"perInvocationTimeout\"] == \"8m\"\n    assert group[\"rawEventsFile\"] == group[\"name\"] + \"-tests.jsonl\"\n    raw = (Path(\"artifacts/native-media-development\") / group[\"rawEventsFile\"]).read_bytes()\n    assert hashlib.sha256(raw).hexdigest() == group[\"rawEventsSha256\"]\n    joined += raw + (b\"\\n\" if raw and not raw.endswith(b\"\\n\") else b\"\")\n    group_started, group_finished = [], {}\n    for line in raw.splitlines():\n        if not line.startswith(b\"{\"): continue\n        event = json.loads(line)\n        name, action = event.get(\"Test\"), event.get(\"Action\")\n        if name in expected and action == \"run\": group_started.append(name)\n        if name in expected and action in {\"pass\", \"fail\", \"skip\"}:\n            assert name not in group_finished\n            group_finished[name] = action\n    if group[\"exitCode\"] == 0:\n        assert len(group_started) == len(group[\"expectedTests\"]) and set(group_started) == set(group[\"expectedTests\"])\n        assert set(group_finished) == set(group[\"expectedTests\"]) and set(group_finished.values()) == {\"pass\"}\nassert joined == Path(\"artifacts/native-media-development/go-tests.jsonl\").read_bytes()\nassert grouped[\"exitCode\"] == int(os.environ[\"MEDIA_GO_STATUS\"])\nassert grouped[\"exitCode\"] != 0 or all(g[\"exitCode\"] == 0 for g in grouped[\"groups\"])\nexpected_packages = {\"github.com/leizd/DeepSeek-Infra/go/internal/\" + p for p in [\"media\", \"store\", \"api\", \"worker\"]}\nif code == 0 and (set(started) != expected or set(finished) != expected or set(started.values()) != {1} or set(finished.values()) != {\"pass\"} or set(packages) != expected_packages or set(packages.values()) != {\"pass\"}): code = 2\ntree = subprocess.check_output([\"git\", \"rev-parse\", \"HEAD^{tree}\"], text=True).strip()\nresult = dict(status=\"PASS\" if code == 0 else \"FAIL\", sourceCommit=os.environ[\"GITHUB_SHA\"], sourceTree=tree, runId=os.environ[\"GITHUB_RUN_ID\"], attempt=os.environ[\"GITHUB_RUN_ATTEMPT\"], event=os.environ[\"GITHUB_EVENT_NAME\"], ref=os.environ[\"GITHUB_REF\"], expectedTests=sorted(expected), finishedTests=finished, packages=packages, exitCode=code, raceEnabled=True, groups=grouped[\"groups\"], perInvocationTimeout=\"8m\", overallStepTimeoutMinutes=12, scope=\"retained media and target lifecycle Go development regressions only; not the original full Go/Android-Go suites or coverage gates\", fullGoSuiteQualified=False, original95PercentCoverageQualified=False, actualNativeLauncherQualified=False, authorityRecoveryQualified=False, fullMigrationQualified=False, readiness=\"NOT_READY\")\nPath(\"artifacts/native-media-development/result.json\").write_text(json.dumps(result, indent=2) + \"\\n\")\nprint(json.dumps(dict(kind=\"native-media-go-gate-v1\",status=result[\"status\"],sourceCommit=os.environ[\"GITHUB_SHA\"],runId=os.environ[\"GITHUB_RUN_ID\"],\n    goProcessExitCode=int(os.environ[\"MEDIA_GO_STATUS\"]),verifierExitCode=code,expectedTests=len(expected),startedTests=len(started),finishedTests=len(finished),\n    missingTests=sorted(expected-set(started)),nonPass={n:v for n,v in finished.items() if v!=\"pass\"},packages=packages)),flush=True)\nraise SystemExit(code)\nPY\n"
      - name: Preserve media development reports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-media-development-${{ github.sha }}
          path: artifacts/native-media-development/
          if-no-files-found: warn
          retention-days: 7
