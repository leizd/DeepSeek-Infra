name: Read existing native media reports

on:
  push:
    branches: ["codex/native-report-relay-*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  collect:
    name: Verify and relay existing report fields only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify the original artifact and emit bounded sanitized report notices
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, io, json, os, stat, urllib.error, urllib.parse, urllib.request, zipfile
          from pathlib import PurePosixPath

          REPO = "leizd/DeepSeek-Infra"
          SOURCE = "8a3933b92d0a29455d7ee36dd33de6214df21a4c"
          TREE = "b8945aa44b8300550f8e74c14fb649e82d407bc8"
          RUN = 40807694460
          ARTIFACT = 12869208139
          DIGEST = "sha256:b3c529898e495ceb68a41658b05e25c11244d1dadd6eba88a746f8e3ac0baddf"
          SIZE = 72283
          assert os.environ["GITHUB_REPOSITORY"] == REPO

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          def fetch(url, limit, authenticated=False):
              opener = urllib.request.build_opener(NoRedirect())
              for hop in range(5):
                  address = urllib.parse.urlsplit(url)
                  host = address.hostname or ""
                  assert address.scheme == "https" and address.username is None and address.port in (None, 443)
                  assert host == "api.github.com" or host.endswith((".blob.core.windows.net", ".actions.githubusercontent.com", ".githubusercontent.com"))
                  headers = {"User-Agent": "DeepSeek-native-report-collector"}
                  if authenticated and hop == 0:
                      assert host == "api.github.com"
                      headers.update(Authorization="Bearer " + os.environ["GH_TOKEN"], Accept="application/vnd.github+json")
                  try:
                      with opener.open(urllib.request.Request(url, headers=headers), timeout=30) as response:
                          data = response.read(limit + 1)
                          assert len(data) <= limit
                          return data
                  except urllib.error.HTTPError as error:
                      assert error.code in (301, 302, 303, 307, 308) and hop < 4
                      url = urllib.parse.urljoin(url, error.headers["Location"])
              raise AssertionError("report redirect bound exceeded")

          def api(path):
              return json.loads(fetch("https://api.github.com/repos/" + REPO + "/" + path, 2 * 1024**2, True))

          def sanitize(value, path="", removed=None):
              removed = [] if removed is None else removed
              if isinstance(value, dict):
                  result = {}
                  for key, item in value.items():
                      child = path + "/" + key
                      if key.lower() in {"argv", "args", "command", "cmdline", "commandline", "environment", "env", "token", "password", "apikey", "privatekey", "private_key", "authorization"}:
                          result[key] = "[redacted diagnostic]"
                          removed.append(child)
                      elif key.endswith("Processes"):
                          assert isinstance(item, list)
                          result[key] = [{field: row[field] for field in ("executable", "pid", "startTicks")} for row in item]
                          removed.append(child + "/diagnostic-fields")
                      else:
                          result[key] = sanitize(item, child, removed)
                  return result
              if isinstance(value, list):
                  return [sanitize(item, path + "/" + str(index), removed) for index, item in enumerate(value)]
              return value

          run = api("actions/runs/" + str(RUN))
          assert run["head_sha"] == SOURCE and run["event"] == "push" and run["run_attempt"] == 1
          assert run["status"] == "completed" and run["conclusion"] == "success"
          assert api("git/commits/" + SOURCE)["tree"]["sha"] == TREE
          artifact = api("actions/artifacts/" + str(ARTIFACT))
          assert not artifact["expired"] and artifact["digest"] == DIGEST and artifact["size_in_bytes"] == SIZE
          assert artifact["workflow_run"]["id"] == RUN and artifact["workflow_run"]["head_sha"] == SOURCE
          assert artifact["name"] == "native-media-recovery-" + SOURCE
          payload = fetch("https://api.github.com/repos/" + REPO + "/actions/artifacts/" + str(ARTIFACT) + "/zip", SIZE, True)
          assert len(payload) == SIZE and "sha256:" + hashlib.sha256(payload).hexdigest() == DIGEST
          records = []
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              infos = archive.infolist()
              assert len(infos) <= 2000 and sum(item.file_size for item in infos) <= 128 * 1024**2
              assert len({item.filename for item in infos}) == len(infos)
              for item in infos:
                  name = PurePosixPath(item.filename)
                  assert not name.is_absolute() and not stat.S_ISLNK(item.external_attr >> 16)
                  assert all(part not in {"", ".", ".."} and ":" not in part and "\\" not in part for part in name.parts)
              context = json.loads(archive.read("source-context.json"))
              assert context["testedRevision"] == SOURCE and context["sourceTreeDirty"] is False
              assert str(context["workflowRunId"]) == str(RUN)
              for folder, backend in [("delete-crash-sqlite", "sqlite"), ("delete-crash-vector", "sqlite_vec")]:
                  name = folder + "/result.json"
                  info = archive.getinfo(name)
                  assert 0 < info.file_size <= 1024**2
                  raw = archive.read(info)
                  report = json.loads(raw)
                  assert report["sourceCommit"] == SOURCE and str(report["runId"]) == str(RUN)
                  assert report["status"] == "PASS" and report["mutation"] == "delete" and report["indexBackend"] == backend
                  removed = []
                  cleaned = sanitize(report, removed=removed)
                  records.append(dict(path=name, bytes=len(raw), rawSha256=hashlib.sha256(raw).hexdigest(), report=cleaned, redactedDiagnosticPaths=removed))
          envelope = dict(schemaVersion=1, kind="native-sanitized-report-relay-v1", originSourceCommit=SOURCE,
              originSourceTree=TREE, originRunId=RUN, artifactId=ARTIFACT, artifactDigest=DIGEST,
              relaySourceCommit=os.environ["GITHUB_SHA"], relayRunId=os.environ["GITHUB_RUN_ID"],
              originalArchiveVerified=True, context=context, records=records, runtimeReexecuted=False,
              compilerCachesOrImagesRelayed=False, qualificationClaimed=False)
          data = json.dumps(envelope, separators=(",", ":"), ensure_ascii=False).encode()
          assert len(data) < 128 * 1024
          encoded = base64.b64encode(gzip.compress(data, mtime=0)).decode()
          pieces = [encoded[start:start+30000] for start in range(0, len(encoded), 30000)]
          assert 1 <= len(pieces) <= 4
          for index, piece in enumerate(pieces, 1):
              print("::notice file=.github/workflows/native-report-relay.yml,line=1,title=native-report-relay-v1-part-" + str(index) + "-of-" + str(len(pieces)) + "::" + piece, flush=True)
          print(json.dumps(dict(status="REPORT_TRANSPORT_ONLY", originSource=SOURCE, originRun=RUN,
              artifactDigest=DIGEST, records=len(records), originalArchiveVerified=True, runtimeReexecuted=False)))
          PY
