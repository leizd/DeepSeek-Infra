name: Read qualified native report fields

on:
  push:
    branches: ["codex/native-report-collector-*"]
  workflow_dispatch:
    inputs:
      reports:
        description: Bounded JSON report specifications for existing runs in this repository
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  collect:
    name: Read existing reports without executing runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify archives and relay bounded sanitized report notices
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SPECS: ${{ inputs.reports }}
        run: python -B scripts/relay_native_reports.py
