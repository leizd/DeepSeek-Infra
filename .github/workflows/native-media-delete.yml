name: Native media DELETE admission
'on':
  push:
    branches:
    - codex/native-media-delete-*
  workflow_dispatch: null
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: native-media-delete-${{ github.ref }}
  cancel-in-progress: false
jobs:
  delete-admission:
    name: Original media DELETE admission
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOCACHE: ${{ runner.temp }}/native-media-delete-go-cache
      DEEPSEEK_EVIDENCE_SOURCE_CONTEXT: ${{ github.workspace }}/artifacts/native-media-delete-admission/source-context.json
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Bind this focused probe to its exact source revision
      run: 'mkdir -p artifacts/native-media-delete-admission

        python scripts/capture_evidence_context.py --version "$(cat VERSION)" --out "$DEEPSEEK_EVIDENCE_SOURCE_CONTEXT"

        '
    - name: Install the repository's checksum-pinned Go for the real signing producer
      run: 'archive="$RUNNER_TEMP/go1.27.1.linux-amd64.tar.gz"

        install_dir="$RUNNER_TEMP/agent-signing-go-1.27.1"

        curl --fail --location --silent --show-error --output "$archive" https://go.dev/dl/go1.27.1.linux-amd64.tar.gz

        echo "63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445  $archive" | sha256sum --check --strict

        mkdir -p "$install_dir"

        tar -xzf "$archive" -C "$install_dir"

        echo "$install_dir/go/bin" >> "$GITHUB_PATH"

        '
    - name: Verify Go modules before the isolated process probe
      working-directory: go
      run: 'test "$(go env GOVERSION)" = "go1.27.1"

        go mod download

        go mod verify

        '
    - name: Run actual retained DELETE admission cases
      working-directory: go
      run: 'set -o pipefail

        go test -count=1 -run "^TestMediaPublicDeleteAdmission$" -json ./internal/api 2>&1 | tee ../artifacts/native-media-delete-admission/go-tests.jsonl

        '
    - name: Preserve admission reports only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-media-delete-admission-${{ github.sha }}
        path: artifacts/native-media-delete-admission/
        if-no-files-found: error
        retention-days: 7
