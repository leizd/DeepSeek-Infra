name: Native Windows app platform verification

on:
  push:
    branches: ["codex/rust-cloud/control-rpc-mtls-*"]
    paths:
      - ".github/workflows/native-windows-cloud.yml"
      - "scripts/verify_native_windows_cloud.py"
      - "go/internal/desktop/**"
      - "tests/test_native_windows_cloud_gate.py"
      - "docs/NATIVE_WINDOWS_CLOUD_VERIFICATION.md"
  workflow_dispatch:
    inputs:
      verify_macos:
        description: 'Also execute the native Go window on actual Intel and Apple silicon macOS runners'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: native-windows-cloud-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  windows-app:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/windows-native-rust-target
      GOCACHE: ${{ github.workspace }}/artifacts/windows-native-go-cache
      GOMODCACHE: ${{ github.workspace }}/artifacts/windows-native-go-modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Install the repository checksum-pinned Windows Go toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = (Get-Content -LiteralPath release/native_runtime_toolchain_v1.json -Raw | ConvertFrom-Json).go
          $artifact = $pin.artifacts.windows_amd64
          $archive = Join-Path $env:RUNNER_TEMP $artifact.filename
          Invoke-WebRequest -Uri ('https://go.dev/dl/' + $artifact.filename) -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $artifact.sha256) { throw 'Windows Go checksum mismatch' }
          $installation = Join-Path $env:RUNNER_TEMP 'deepseek-windows-go'
          Expand-Archive -LiteralPath $archive -DestinationPath $installation
          $goBin = Join-Path $installation 'go/bin'
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $goBin
          $version = & (Join-Path $goBin 'go.exe') version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch ('go' + [regex]::Escape($pin.version) + ' windows/amd64')) { throw 'Unexpected Windows Go toolchain' }
      - name: Restore cloud-only Windows compilation caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
            ~/.cargo/registry
            ~/.cargo/git
          key: native-windows-v1-1.85.0-1.27.1-${{ hashFiles('rust/**/Cargo.toml', 'rust/Cargo.lock', 'go/go.sum') }}-${{ github.sha }}
          restore-keys: |
            native-windows-v1-1.85.0-1.27.1-${{ hashFiles('rust/**/Cargo.toml', 'rust/Cargo.lock', 'go/go.sum') }}-
      - name: Build the original React application
        run: |
          npm ci --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed' }
          npm run build --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
      - name: Prepare exact-source platform evidence
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows-native-cloud | Out-Null
          python scripts/capture_evidence_context.py --out artifacts/windows-native-cloud/source-context.json
          if ($LASTEXITCODE -ne 0) { throw 'Source context capture failed' }
      - name: Build actual Windows Rust worker and public edge
        run: |
          python scripts/rust_build.py --toolchain 1.85.0 --target-dir $env:CARGO_TARGET_DIR -- build --locked -p deepseek-worker -p deepseek-gateway --bins 2>&1 | Tee-Object -FilePath artifacts/windows-native-cloud/rust-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows Rust build failed' }
      - name: Verify retained media synchronization and recovery on Windows
        run: |
          python scripts/rust_build.py --toolchain 1.85.0 --target-dir $env:CARGO_TARGET_DIR -- test --locked -p deepseek-worker --lib media_journal::tests 2>&1 | Tee-Object -FilePath artifacts/windows-native-cloud/media-journal-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows media journal recovery tests failed' }
          $tests = Get-Content -LiteralPath artifacts/windows-native-cloud/media-journal-tests.log -Raw
          foreach ($name in @('media_retained_publication_sync_never_creates_or_replaces_bytes', 'media_windows_readonly_recovery_keeps_original_unknown_until_sync_is_possible')) {
            if ($tests -notmatch ('test .*' + $name + ' \.\.\. ok')) { throw ('Windows recovery case missing: ' + $name) }
          }
      - name: Build actual Windows Go control, launcher and WebView2 host
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'deepseek-windows-bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'debug/deepseek-worker.exe') -Destination $bin
          Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'debug/deepseek-gateway.exe') -Destination $bin
          Push-Location go
          try {
            foreach ($name in @('deepseekd', 'deepseek-launch', 'deepseek-desktop')) {
              go build -trimpath -o (Join-Path $bin ($name + '.exe')) ('./cmd/' + $name)
              if ($LASTEXITCODE -ne 0) { throw ('Windows Go build failed: ' + $name) }
            }
          } finally { Pop-Location }
      - name: Exercise actual app window, native provenance, file workload and close/restart
        run: |
          python scripts/verify_native_windows_cloud.py --bin (Join-Path $env:RUNNER_TEMP 'deepseek-windows-bin') --profile (Join-Path $env:RUNNER_TEMP 'deepseek-windows-disposable-profile') --out artifacts/windows-native-cloud
          if ($LASTEXITCODE -ne 0) { throw 'Windows app platform gate failed' }
      - name: Preserve bounded platform reports without binaries or caches
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows-platform-${{ github.sha }}
          path: |
            artifacts/windows-native-cloud/*.json
            artifacts/windows-native-cloud/*.jsonl
            artifacts/windows-native-cloud/*.log
          if-no-files-found: warn
          retention-days: 7

  macos-build:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_macos
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the unchanged checksum-pinned Linux Go cross compiler
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,shutil,tarfile,urllib.request
          from pathlib import Path
          pin=json.loads(Path('release/native_runtime_toolchain_v1.json').read_bytes())['go']
          artifact=pin['artifacts']['linux_amd64']
          archive=Path(os.environ['RUNNER_TEMP'])/artifact['filename']
          with urllib.request.urlopen('https://go.dev/dl/'+artifact['filename'],timeout=60) as response,archive.open('wb') as target:
              shutil.copyfileobj(response,target,1024**2)
          assert hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()==artifact['sha256']
          destination=Path(os.environ['RUNNER_TEMP'])/'macos-window-go'
          with tarfile.open(archive) as source:
              source.extractall(destination,filter='data')
          with open(os.environ['GITHUB_PATH'],'a') as path:
              path.write(str(destination/'go/bin')+'\n')
          PY
      - name: Cross compile the real Go desktop program and native test host for both architectures
        run: |
          set -euo pipefail
          export GOCACHE="$RUNNER_TEMP/macos-window-go-cache"
          export GOMODCACHE="$RUNNER_TEMP/macos-window-go-modules"
          out="$GITHUB_WORKSPACE/artifacts/macos-fixtures"
          mkdir -p "$out"
          go version | tee "$out/go-version.txt"
          python scripts/capture_evidence_context.py --out "$out/source-context.json"
          cd go
          for arch in amd64 arm64; do
            mkdir -p "$out/$arch"
            GOOS=darwin GOARCH="$arch" go build -trimpath -o "$out/$arch/deepseek-desktop" ./cmd/deepseek-desktop
            GOOS=darwin GOARCH="$arch" go test -c -trimpath -tags=native_desktop_integration -o "$out/$arch/desktop.test" ./internal/desktop
          done
          cd ..
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('artifacts/macos-fixtures')
          pin=json.loads(Path('release/native_runtime_toolchain_v1.json').read_bytes())['go']
          version=subprocess.check_output(['go','version'],text=True).strip()
          assert version.startswith('go version go'+pin['version']+' linux/amd64')
          rows=[]
          for arch in ['amd64','arm64']:
              for name in ['deepseek-desktop','desktop.test']:
                  path=root/arch/name
                  rows.append(dict(path=arch+'/'+name,architecture=arch,bytes=path.stat().st_size,sha256=hashlib.file_digest(path.open('rb'),'sha256').hexdigest()))
          value=dict(sourceCommit=os.environ['GITHUB_SHA'],sourceTree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),runId=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],goVersion=version,linuxGoArchiveSha256=pin['artifacts']['linux_amd64']['sha256'],cgoEnabled=False,binaries=rows,fullMigrationQualified=False)
          (root/'build-receipt.json').write_text(json.dumps(value,indent=2)+'\n')
          PY
      - name: Keep executable fixtures inside the cloud
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-macos-fixtures-${{ github.sha }}
          path: artifacts/macos-fixtures/
          if-no-files-found: error
          retention-days: 3

  macos-window:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_macos
    needs: macos-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      DEEPSEEK_MACOS_ARCH: ${{ matrix.architecture }}
      DEEPSEEK_MACOS_PROFILE: ${{ github.workspace }}/artifacts/native-macos-disposable-profile
      DEEPSEEK_MACOS_REPORT: ${{ github.workspace }}/artifacts/macos-window/result.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-macos-fixtures-${{ github.sha }}
          path: artifacts/macos-fixtures
      - name: Verify exact source, runtime architecture and every executable before running it
        run: |
          set -euo pipefail
          mkdir -p artifacts/macos-window
          python scripts/capture_evidence_context.py --out artifacts/macos-window/source-context.json
          python - <<'PY'
          import hashlib,json,os,platform,struct,subprocess
          from pathlib import Path
          assert os.environ['GITHUB_ACTIONS']=='true' and os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          assert platform.system()=='Darwin' and os.environ['RUNNER_OS']=='macOS'
          arch=os.environ['DEEPSEEK_MACOS_ARCH']
          assert platform.machine()=={'amd64':'x86_64','arm64':'arm64'}[arch]
          root=Path('artifacts/macos-fixtures').resolve()
          receipt=json.loads((root/'build-receipt.json').read_bytes())
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          assert (receipt['sourceCommit'],receipt['sourceTree'],receipt['runId'],receipt['attempt'])==(os.environ['GITHUB_SHA'],tree,os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT'])
          pin=json.loads(Path('release/native_runtime_toolchain_v1.json').read_bytes())['go']
          assert receipt['linuxGoArchiveSha256']==pin['artifacts']['linux_amd64']['sha256'] and receipt['cgoEnabled'] is False
          assert receipt['goVersion'].startswith('go version go'+pin['version']+' linux/amd64')
          assert {(r['architecture'],r['path']) for r in receipt['binaries']}=={(a,a+'/'+n) for a in ['amd64','arm64'] for n in ['deepseek-desktop','desktop.test']}
          for row in receipt['binaries']:
              path=root/row['path'];assert path.is_file() and not path.is_symlink() and path.resolve().is_relative_to(root)
              assert path.stat().st_size==row['bytes'] and hashlib.file_digest(path.open('rb'),'sha256').hexdigest()==row['sha256']
              magic,cpu=struct.unpack('<II',path.open('rb').read(8))
              assert (magic,cpu)==(0xfeedfacf,{'amd64':0x1000007,'arm64':0x100000c}[row['architecture']])
          for name in ['deepseek-desktop','desktop.test']:(root/arch/name).chmod(0o700)
          Path('artifacts/macos-window/build-receipt.json').write_bytes((root/'build-receipt.json').read_bytes())
          PY
      - name: Verify native bundle identity, update isolation, link denial and browser credential boundaries
        run: |
          set -euo pipefail
          set -o pipefail
          "artifacts/macos-fixtures/$DEEPSEEK_MACOS_ARCH/desktop.test" -test.v -test.count=1 -test.timeout=60s -test.run='^TestNativeMac(Bundle|Browser)' 2>&1 | tee artifacts/macos-window/profile-browser-test.log
      - name: Exercise a real visible window, authenticated WebKit DOM and cancellation
        run: |
          set -euo pipefail
          set -o pipefail
          "artifacts/macos-fixtures/$DEEPSEEK_MACOS_ARCH/desktop.test" -test.v -test.count=1 -test.timeout=60s -test.run='^TestNativeMacWindowBootAndCancel$' 2>&1 | tee artifacts/macos-window/window-test.log
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path(os.environ['DEEPSEEK_MACOS_REPORT']).read_bytes())
          assert report['sourceCommit']==os.environ['GITHUB_SHA'] and report['runId']==os.environ['GITHUB_RUN_ID']
          assert report['architecture']==os.environ['DEEPSEEK_MACOS_ARCH']
          assert all(report[k] is True for k in ['visible','titleMatched','authenticatedDOMObserved','contextCancellationSettled','nativeMainThreadObserved','persistentDataStoreObserved'])
          receipt=json.loads(Path('artifacts/macos-window/build-receipt.json').read_bytes())
          binary=next(row for row in receipt['binaries'] if row['path']==os.environ['DEEPSEEK_MACOS_ARCH']+'/desktop.test')
          assert report['actualExecutableSha256']==binary['sha256']
          assert report['bundleIdentifier'].startswith('com.deepseekinfra.profile.p')
          assert set(report['protocolMetadataAvailability'])=={'NSWindowDelegate','NSApplicationDelegate','WKUIDelegate','WKNavigationDelegate','WKDownloadDelegate'}
          assert all(type(report[k]) is int and report[k]>0 for k in ['nativeNavigationActionCallbacks','nativeNavigationResponseCallbacks','nativeDispatchCallbacks'])
          assert report['windowId']>0 and report['contentWidth']>=760 and report['contentHeight']>=520
          assert report['productionApplicationWorkloadQualified'] is False and report['fullMigrationQualified'] is False and report['readiness']=='NOT_READY'
          PY
      - name: Retain reports only for local collection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-macos-window-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            artifacts/macos-window/*.json
            artifacts/macos-window/*.log
          if-no-files-found: error
          retention-days: 7
