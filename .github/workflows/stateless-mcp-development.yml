name: Stateless MCP security development checks
'on':
  push:
    branches:
    - codex/rust-cloud/mcp-security-*
    paths:
    - stateless-mcp/**
    - .github/workflows/stateless-mcp-development.yml
  workflow_dispatch: null
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: stateless-mcp-development-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: stateless-mcp/package-lock.json
    - name: Record exact development source
      run: |-
        mkdir -p artifacts/stateless-mcp-development
        python - <<'PY'
        import json, os, subprocess
        from pathlib import Path
        assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == os.environ["GITHUB_SHA"]
        assert not subprocess.check_output(["git", "status", "--porcelain"]).strip()
        Path("artifacts/stateless-mcp-development/source-context.json").write_text(json.dumps({"sourceCommit": os.environ["GITHUB_SHA"], "sourceTree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(), "runId": os.environ["GITHUB_RUN_ID"], "event": os.environ["GITHUB_EVENT_NAME"], "fullMigrationQualified": False, "readiness": "NOT_READY"}, indent=2))
        PY
    - run: sudo apt-get update && sudo apt-get install -y ripgrep
    - name: Install the pinned SDK and existing dependency graph
      run: npm ci --prefix stateless-mcp
    - name: Typecheck and run every retained MCP test plus security regressions
      working-directory: stateless-mcp
      run: |-
        npm run typecheck
        npm run build
        node --test --test-reporter=tap dist/test/*.test.js 2>&1 | tee ../artifacts/stateless-mcp-development/tests.log
        python - <<'PY'
        import json, os, re
        from pathlib import Path
        text = Path("../artifacts/stateless-mcp-development/tests.log").read_text()
        counts = {name: int(value) for name, value in re.findall(r"^# (tests|pass|fail|cancelled|skipped) (\d+)$", text, re.M)}
        assert counts["tests"] >= 26 and counts["pass"] == counts["tests"]
        assert counts["fail"] == counts["cancelled"] == counts["skipped"] == 0
        Path("../artifacts/stateless-mcp-development/result.json").write_text(json.dumps({"status": "PASS", "sourceCommit": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"], "event": os.environ["GITHUB_EVENT_NAME"], "tests": counts, "fullMigrationQualified": False, "readiness": "NOT_READY"}, indent=2))
        PY
    - name: Prove the refusal regressions fail without the explicit bounds
      run: |-
        python - <<'PY'
        import json, os, re, shutil, subprocess
        from pathlib import Path
        source = Path("stateless-mcp").resolve()
        target = Path(os.environ["RUNNER_TEMP"]) / "mcp-unbounded-regression"
        assert not target.exists()
        shutil.copytree(source, target, ignore=shutil.ignore_patterns("node_modules", "dist"))
        (target / "node_modules").symlink_to(source / "node_modules", target_is_directory=True)
        for name, marker in [("src/mcp-server.ts", "      maxToolInputElements: 10_000,\n"), ("src/mcp-handler.ts", "    maxRequestBodySize: 1024 * 1024,\n")]:
            path = target / name
            text = path.read_text()
            assert text.count(marker) == 1
            path.write_text(text.replace(marker, ""))
        subprocess.run(["npm", "run", "build"], cwd=target, check=True)
        expected = {"SDK refuses oversized structured arguments before durable task creation", "HTTP body limit refuses an oversized request and retains normal serving"}
        pattern = "^(" + "|".join(sorted(expected)) + ")$"
        process = subprocess.run(["node", "--test", "--test-reporter=tap", "--test-name-pattern=" + pattern, "dist/test/mcp-security.test.js"], cwd=target, capture_output=True, text=True, timeout=90)
        Path("artifacts/stateless-mcp-development/unbounded-negative.log").write_text(process.stdout + process.stderr)
        failed = set(re.findall(r"^not ok \d+ - (.+)$", process.stdout, re.M))
        assert process.returncode == 1 and failed == expected
        assert process.stdout.count("code: 'ERR_ASSERTION'") == 2
        assert not subprocess.check_output(["git", "status", "--porcelain"]).strip()
        Path("artifacts/stateless-mcp-development/negative-result.json").write_text(json.dumps({"status": "PASS", "sourceCommit": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"], "event": os.environ["GITHUB_EVENT_NAME"], "mutatedOnlyTemporaryCopy": True, "expectedAssertionFailures": sorted(failed), "fullMigrationQualified": False}, indent=2))
        PY
    - name: Upload report evidence only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: stateless-mcp-development-${{ github.sha }}
        path: artifacts/stateless-mcp-development/
        if-no-files-found: warn
  security:
    needs: release-version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: python -m pip install --upgrade pip
    - run: python -m pip install pip-audit bandit detect-secrets
    - run: npm ci --prefix frontend
    - run: npm ci --prefix stateless-mcp
    - name: npm audit (high; documented exceptions gated)
      run: |
        mkdir -p artifacts
        status=0
        npm audit --prefix frontend --audit-level=high --json > artifacts/npm-audit.json || status=$?
        if [ "$status" -gt 1 ]; then cat artifacts/npm-audit.json; exit "$status"; fi
        python scripts/check_npm_audit.py artifacts/npm-audit.json
    - name: Stateless MCP npm audit (high)
      run: npm audit --prefix stateless-mcp --audit-level=high
    - run: pip-audit -r requirements.txt -r requirements-dev.txt -r requirements-browser.txt -r requirements-s3-e2e.txt
    - run: bandit -r deepseek_infra --severity-level high -q
    - run: detect-secrets scan --baseline .secrets.baseline
    - name: Upload the original audit report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: stateless-mcp-security-audit-${{ github.sha }}
        path: artifacts/npm-audit.json
        if-no-files-found: warn
    timeout-minutes: 20
  release-version:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Check release version consistency
      run: python scripts/check_release_version.py --strict-branch
