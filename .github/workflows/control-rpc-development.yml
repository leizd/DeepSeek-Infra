name: Native control RPC development checks

on:
  push:
    branches:
      - "codex/rust-cloud/android-platform-diagnostics-*"
      - "codex/rust-cloud/control-rpc-mtls-*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: control-rpc-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      GIT_OPTIONAL_LOCKS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install the same checksum-pinned Go used by full verification
        run: |
          archive="$RUNNER_TEMP/go1.27.1.linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" https://go.dev/dl/go1.27.1.linux-amd64.tar.gz
          echo "63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/control-go"
          tar -xzf "$archive" -C "$RUNNER_TEMP/control-go"
          echo "$RUNNER_TEMP/control-go/go/bin" >> "$GITHUB_PATH"
      - name: Exercise real control lifecycle regressions without release qualification
        env:
          # Go race instrumentation requires Cgo; production builds remain pure Go.
          CGO_ENABLED: "1"
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p artifacts/control-rpc-development
          cd go
          set +e
          go test -race -json -count=1 -timeout=3m -covermode=atomic -coverprofile=../artifacts/control-rpc-development/go-scoped-coverage.out ./internal/config ./internal/lifecycle ./internal/launch > ../artifacts/control-rpc-development/go-tests.jsonl 2>&1
          go_status=$?
          set -e
          cd ..
          export CONTROL_GO_STATUS="$go_status"
          python - <<'PY'
          import json, os
          from pathlib import Path
          required = {
              "TestInternalRPCRequiresCompleteLoopbackTLSAndAuthenticatedDeployment",
              "TestActualLifecycleServesMutuallyAuthenticatedRPCAndRetainsDomainRefusal",
              "TestActualLifecycleRequiresBothTrustedClientCertificateAndBearer",
              "TestActualLifecycleCancellationClosesBothListenersBeforeWriterSuccessor",
              "TestProductionRPCPlanForwardsBothTransportEndpoints",
              "TestProductionRPCPlanRejectsPartialTransportBeforeLaunch",
              "TestProductionRPCPlanIsolatesServerAndRustCustodyCredentials",
              "TestProductionRPCOptionsReachEveryChildWithRoleIsolation",
              "TestProductionRPCLocalAuthReachesEveryChildWithoutReplacingStoredToken",
              "TestProductionRPCOperatorAuthAndDisabledModeReachExistingChildrenWithoutDiskWrites",
              "TestProductionRPCOptionsScopeNilChildEnvironmentsAndDoNotMutateOriginalPlan",
              "TestManagedNativeStartupUsesAuthenticatedBindingAndRetainsWriterFence",
              "TestManagedMissingKeysNeverTriggerInitializer",
              "TestManagedProfileRejectsRedirectedPrivateDirectories",
              "TestManagedBootstrapFaultsNeverStartControlOrReplaceCustody",
              "TestManagedBootstrapRejectsCorruptMetadataBeforeInitialization",
              "TestManagedFreshnessRequiresReadableExclusiveNativeMetadata",
              "TestManagedBoundedReadsRefuseTruncationAndIOFailure",
              "TestManagedInitializerRequiresFenceAndReportsRealChildFailure",
              "TestManagedRuntimeRejectsInvalidPlansAndUnavailableBinding",
              "TestManagedProfileRequiresOriginalMetadataAndExclusiveOwner",
              "TestManagedProfileNeverRecreatesLostCustodyOrGoState",
              "TestManagedGoTransportIdentityIsBoundToOwnServer",
              "TestManagedRoleScopesAndExplicitOperatorProvisioning",
              "TestManagedExpectedWriterFenceIsExplicitAndStrict",
              "TestManagedNativeOriginRequiresPinnedAuthoritativeDeployment",
              "TestManagedControlReadinessRequiresTheExpectedLiveWriter",
              "TestManagedControlReadinessWaitsForRetainedWriterLease",
              "TestManagedDesktopKeepsItsPreparedEnvironmentPrivate",
              "TestManagedDesktopAndEdgeWaitForActualControlReadiness",
              "TestProductionAgentCredentialsAndBodyCustodyStayInRustRoles",
              "TestManagedControlReadinessRefusesForeignTargetsAndCancellation",
              "TestManagedGatewayWaitsForActualControlReadiness",
              "TestManagedLifecycleRejectsChangedWriterFenceBeforeServing",
          }
          started, finished = set(), {}
          for line in Path("artifacts/control-rpc-development/go-tests.jsonl").read_text().splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              name, action = row.get("Test"), row.get("Action")
              if name in required and action == "run":
                  started.add(name)
              if name in required and action in {"pass", "fail", "skip"}:
                  finished[name] = action
          code = int(os.environ["CONTROL_GO_STATUS"])
          if code == 0 and (started != required or set(finished) != required or set(finished.values()) != {"pass"}):
              code = 2
          report = {"kind": "native-control-rpc-development-v1", "sourceCommit": os.environ["GITHUB_SHA"],
                    "runId": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "event": os.environ["GITHUB_EVENT_NAME"], "ref": os.environ["GITHUB_REF"],
                    "scope": "complete config/lifecycle/launch packages with race detection", "exitCode": code,
                    "expectedTests": sorted(required), "startedExpectedTests": sorted(started), "finishedExpectedTests": finished,
                    "fullGoSuiteQualified": False, "coverageQualified": False, "releaseQualified": False, "fullMigrationQualified": False}
          Path("artifacts/control-rpc-development/result.json").write_text(json.dumps(report, indent=2) + "\n")
          raise SystemExit(code)
          PY
      - name: Prove desktop regressions reject temporary UI capability leakage
        env:
          CGO_ENABLED: "1"
        run: |
          python - <<'PY'
          from collections import Counter
          import hashlib, json, os, re, shutil, subprocess, tempfile
          from pathlib import Path
          required = {"TestManagedDesktopKeepsItsPreparedEnvironmentPrivate",
                      "TestManagedDesktopAndEdgeWaitForActualControlReadiness"}
          log = Path("artifacts/control-rpc-development/desktop-negative-tests.jsonl")
          with tempfile.TemporaryDirectory(prefix="desktop-negative-", dir=os.environ["RUNNER_TEMP"]) as directory:
              negative = Path(directory) / "go"
              shutil.copytree("go", negative, ignore=shutil.ignore_patterns("*.exe", "*.out", "coverage*", "bin"))
              path = negative / "internal/launch/child_environment.go"
              source = path.read_text()
              start = source.index("\t\t// WithDesktop already built a reduced UI environment.")
              end = source.index("\t\tcurrent := process.Env", start)
              removed = source[start:end]
              assert removed.count('if process.Name == "deepseek-desktop"') == 1
              assert 'updated.Processes[index].Env = append([]string{}, process.Env...)' in removed
              assert removed.count("continue") == 1
              path.write_text(source[:start] + source[end:])
              pattern = "^(" + "|".join(re.escape(name) for name in sorted(required)) + ")$"
              with log.open("wb") as output:
                  result = subprocess.run(["go", "test", "-race", "-json", "-count=1", "-timeout=3m",
                                           "./internal/launch", "-run", pattern], cwd=negative, stdout=output, stderr=subprocess.STDOUT)
          started, failed = Counter(), Counter()
          packages = {}
          for line in log.read_text().splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  assert line.startswith("go: downloading ")
                  continue
              name, action = row.get("Test"), row.get("Action")
              if name and action == "run":
                  started[name] += 1
              if name and action in {"pass", "fail", "skip"}:
                  assert action == "fail", name
                  failed[name] += 1
              if not name and action in {"pass", "fail", "skip"}:
                  packages[row["Package"]] = action
          assert result.returncode == 1 and started == failed and set(failed) == required and all(v == 1 for v in failed.values())
          assert packages == {"github.com/leizd/DeepSeek-Infra/go/internal/launch": "fail"}
          subprocess.run(["git", "diff", "--exit-code", "--", "go"], check=True)
          Path("artifacts/control-rpc-development/desktop-negative-result.json").write_text(json.dumps({
              "status": "PASS", "sourceCommit": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
              "event": os.environ["GITHUB_EVENT_NAME"], "expectedAssertionFailuresObserved": sorted(failed),
              "onlyTemporaryCopyModified": True, "removedGuardSha256": hashlib.sha256(removed.encode()).hexdigest(),
              "fullMigrationQualified": False, "realPlatformUIQualified": False}, indent=2) + "\n")
          PY
      - name: Prove managed startup refuses an omitted public signer realm
        env:
          CGO_ENABLED: "1"
        run: |
          python - <<'PY'
          from collections import Counter
          import json, os, shutil, subprocess, tempfile
          from pathlib import Path
          required = {"TestManagedNativeStartupUsesAuthenticatedBindingAndRetainsWriterFence"}
          fields = {'"DEEPSEEK_WORKER_AUTHORITY_FLEET_ID=" + binding.FleetID,',
                    '"DEEPSEEK_WORKER_AUTHORITY_ENVIRONMENT=" + binding.Environment,'}
          log = Path("artifacts/control-rpc-development/signer-realm-negative-tests.jsonl")
          with tempfile.TemporaryDirectory(prefix="signer-realm-negative-", dir=os.environ["RUNNER_TEMP"]) as directory:
              negative = Path(directory) / "go"
              shutil.copytree("go", negative, ignore=shutil.ignore_patterns("*.exe", "*.out", "coverage*", "bin"))
              path = negative / "internal/launch/managed_profile.go"
              lines = path.read_text().splitlines(keepends=True)
              removed = [line for line in lines if line.strip() in fields]
              assert len(removed) == 2 and {line.strip() for line in removed} == fields
              path.write_text("".join(line for line in lines if line.strip() not in fields))
              with log.open("wb") as output:
                  result = subprocess.run(["go", "test", "-race", "-json", "-count=1", "-timeout=3m",
                                           "./internal/launch", "-run", "^TestManagedNativeStartupUsesAuthenticatedBindingAndRetainsWriterFence$"],
                                          cwd=negative, stdout=output, stderr=subprocess.STDOUT)
          started, failed = Counter(), Counter()
          packages = {}
          for line in log.read_text().splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  assert line.startswith("go: downloading ")
                  continue
              name, action = row.get("Test"), row.get("Action")
              if name and action == "run":
                  started[name] += 1
              if name and action in {"pass", "fail", "skip"}:
                  assert action == "fail", name
                  failed[name] += 1
              if not name and action in {"pass", "fail", "skip"}:
                  packages[row["Package"]] = action
          assert result.returncode == 1 and started == failed and set(failed) == required and all(v == 1 for v in failed.values())
          assert packages == {"github.com/leizd/DeepSeek-Infra/go/internal/launch": "fail"}
          subprocess.run(["git", "diff", "--exit-code", "--", "go"], check=True)
          Path("artifacts/control-rpc-development/signer-realm-negative-result.json").write_text(json.dumps({
              "status": "PASS", "sourceCommit": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
              "event": os.environ["GITHUB_EVENT_NAME"], "expectedAssertionFailuresObserved": sorted(failed),
              "omittedPublicRealmFields": sorted(fields), "onlyTemporaryCopyModified": True,
              "fullMigrationQualified": False}, indent=2) + "\n")
          PY
      - name: Prove read-only native restart regressions detect ignored committed WAL
        env:
          CGO_ENABLED: "1"
        run: |
          python - <<'PY'
          from collections import Counter
          import json, os, shutil, subprocess, tempfile
          from pathlib import Path
          required = {"TestNativeOriginRestartRetainsCommittedWALWithReadOnlyObserver",
                      "TestNativeOriginWALMarkerRejectsCommittedForeignSchemaWithoutWrites"}
          log = Path("artifacts/control-rpc-development/native-wal-negative-tests.jsonl")
          with tempfile.TemporaryDirectory(prefix="native-wal-negative-", dir=os.environ["RUNNER_TEMP"]) as directory:
              negative = Path(directory) / "go"
              shutil.copytree("go", negative, ignore=shutil.ignore_patterns("*.exe", "*.out", "coverage*", "bin"))
              path = negative / "internal/store/control.go"
              source = path.read_text()
              marker = source.index("func validateExistingControlMarker(")
              first = source.index('\tdsn := readOnlyControlDatabaseDSN(databasePath)\n', marker)
              last = source.index('\tif err != nil {', source.index('\tdb, err := sqlitedb.Open(dsn)\n', first))
              path.write_text(source[:first] + '\tdb, err := sqlitedb.Open(readOnlyControlDatabaseDSN(databasePath))\n' + source[last:])
              with log.open("wb") as output:
                  result = subprocess.run(["go", "test", "-race", "-json", "-count=1", "-timeout=3m", "./internal/store",
                      "-run", "^TestNativeOrigin(RestartRetainsCommittedWALWithReadOnlyObserver|WALMarkerRejectsCommittedForeignSchemaWithoutWrites)$"],
                      cwd=negative, stdout=output, stderr=subprocess.STDOUT)
          started, failed = Counter(), Counter()
          packages = {}
          for line in log.read_text().splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  assert line.startswith("go: downloading ")
                  continue
              name, action = row.get("Test"), row.get("Action")
              if name and action == "run": started[name] += 1
              if name and action in {"pass", "fail", "skip"}:
                  assert action == "fail"
                  failed[name] += 1
              if not name and action in {"pass", "fail", "skip"}: packages[row["Package"]] = action
          assert result.returncode == 1 and started == failed and set(failed) == required and all(v == 1 for v in failed.values())
          assert packages == {"github.com/leizd/DeepSeek-Infra/go/internal/store": "fail"}
          subprocess.run(["git", "diff", "--exit-code", "--", "go"], check=True)
          Path("artifacts/control-rpc-development/native-wal-negative-result.json").write_text(json.dumps({
              "status": "PASS", "sourceCommit": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
              "event": os.environ["GITHUB_EVENT_NAME"], "expectedAssertionFailuresObserved": sorted(failed),
              "onlyTemporaryCopyModified": True, "originalImmutableMarkerRestored": True, "fullMigrationQualified": False}, indent=2) + "\n")
          PY
      - name: Prove catalog activation and retained writer lease regressions fail without their guards
        env:
          CGO_ENABLED: "1"
        run: |
          python - <<'PY'
          from collections import Counter
          import json, os, shutil, subprocess, tempfile
          from pathlib import Path
          launch = "TestManagedControlReadinessWaitsForRetainedWriterLease"
          store = "TestNativeOriginFaultClosedOrExpiredWriterCannotActivate"
          expected_failures = {launch, store, store + "/foreign-schema"}
          expected_passes = {store + "/" + case for case in ("closed-store", "closed-database", "expired-writer")}
          log = Path("artifacts/control-rpc-development/native-activation-lease-negative-tests.jsonl")
          with tempfile.TemporaryDirectory(prefix="native-activation-lease-negative-", dir=os.environ["RUNNER_TEMP"]) as directory:
              negative = Path(directory) / "go"
              shutil.copytree("go", negative, ignore=shutil.ignore_patterns("*.exe", "*.out", "coverage*", "bin"))
              path = negative / "internal/store/native_origin.go"
              source = path.read_text()
              guard = ('\t// Pending native provenance permits only the known control schema. Check\n'
                       '\t// the complete main catalog before any domain can become authoritative.\n'
                       '\tif err = validateControlUserObjects(tx, store.schema); err != nil {\n'
                       '\t\treturn err\n\t}\n')
              assert source.count(guard) == 1
              path.write_text(source.replace(guard, "", 1))
              path = negative / "internal/launch/control_readiness.go"
              source = path.read_text()
              before = "context.WithTimeout(ctx, config.ControlWriterStartupWait+5*time.Second)"
              assert source.count(before) == 1
              path.write_text(source.replace(before, "context.WithTimeout(ctx, 20*time.Second)", 1))
              with log.open("wb") as output:
                  result = subprocess.run(["go", "test", "-race", "-json", "-count=1", "-timeout=2m", "./internal/store", "./internal/launch",
                      "-run", "^(" + launch + "|" + store + ")$"], cwd=negative, stdout=output, stderr=subprocess.STDOUT)
          started, terminal = Counter(), Counter()
          failed, passed, packages = set(), set(), {}
          for line in log.read_text().splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  assert line.startswith("go: downloading ")
                  continue
              name, action = row.get("Test"), row.get("Action")
              if name and action == "run": started[name] += 1
              if name and action in {"pass", "fail", "skip"}:
                  assert action != "skip"
                  terminal[name] += 1
                  (failed if action == "fail" else passed).add(name)
              if not name and action in {"pass", "fail", "skip"}: packages[row["Package"]] = action
          assert result.returncode == 1 and started == terminal and all(n == 1 for n in started.values())
          assert failed == expected_failures and passed == expected_passes
          assert packages == {"github.com/leizd/DeepSeek-Infra/go/internal/" + name: "fail" for name in ("store", "launch")}
          subprocess.run(["git", "diff", "--exit-code", "--", "go"], check=True)
          Path("artifacts/control-rpc-development/native-activation-lease-negative-result.json").write_text(json.dumps({
              "status": "PASS", "sourceCommit": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
              "event": os.environ["GITHUB_EVENT_NAME"], "expectedAssertionFailuresObserved": sorted(failed),
              "unrelatedRefusalsRetained": sorted(passed), "original20SecondBudgetRestored": True,
              "catalogPreflightOmitted": True, "onlyTemporaryCopyModified": True, "fullMigrationQualified": False}, indent=2) + "\n")
          PY
      - name: Exercise managed binding and writer preview regressions
        env:
          CGO_ENABLED: "1"
        run: |
          cd go
          set +e
          # All original groups plus 54 custody/transaction fault cases; bounded
          # above their measured combined runtime, with no skipped assertions.
          go test -race -json -count=1 -timeout=5m -covermode=atomic -coverprofile=../artifacts/control-rpc-development/managed-binding-scoped-coverage.out ./internal/worker ./internal/store ./internal/api -run '^(TestReadControlSignerBinding.*|TestNextWriterFencingToken.*|TestNativeOrigin.*|TestEmptyPythonInventoryStillRequiresAttestedSource|TestAgentDriverSafeConfigurationFailuresRemainRedacted|TestAgentDriverLoopSuppressesCredentialErrorsAndStopsCancelledWork)$' > ../artifacts/control-rpc-development/managed-binding-tests.jsonl 2>&1
          status=$?
          set -e
          cd ..
          export MANAGED_GO_STATUS="$status"
          python - <<'PY'
          import json, os
          from pathlib import Path
          required = {"TestReadControlSignerBindingValidatesPublicMetadata", "TestReadControlSignerBindingRejectsMalformedResponses",
                      "TestReadControlSignerBindingRefusesUntrustedDiscovery", "TestNextWriterFencingTokenReadsActualWALWithoutClaiming",
                      "TestNextWriterFencingTokenRejectsForeignAndMalformedStores",
                      "TestNextWriterFencingTokenAndControlWriterDenyPythonCapabilitiesBeforeCreation",
                      "TestNextWriterFencingTokenRejectsCorruptionWithoutRepairingDatabase",
                      "TestNextWriterFencingTokenCannotCreateRelativeStoreAfterWorkingDirectoryLoss",
                      "TestNativeOriginCreatesGoOwnedDomainsAndRetainsBirthAcrossTakeover",
                      "TestNativeOriginLostPublicationResponseRecoversOriginalAtSuccessorFence",
                      "TestNativeOriginPublishedCustodyNeverRecreatesLostGoDatabase",
                      "TestNativeOriginRejectsTruncatedPublishedGoDatabaseWithoutRepair",
                      "TestNativeOriginRejectsExistingEmptyAndLegacyStoresWithoutTouchingThem",
                      "TestNativeOriginRejectsTamperedBirthBeforeDatabaseCreation",
                      "TestNativeOriginTornIntentResumesOnlyBeforeDatabaseCreation",
                      "TestNativeOriginMissingRustPublicationNeverReissuesACommittedReceipt",
                      "TestNativeOriginPreviewOfInterruptedCreationIsReadOnlyAndPinned",
                      "TestNativeOriginRollbackCannotErasePublishedOrPendingBirth",
                      "TestNativeOriginLegacyEmptyRollbackRetainsOriginalReopenBehavior",
                      "TestNativeOriginLegacyV17UpgradeRetainsEveryProtectedRow",
                      "TestNativeOriginClientRequiresAuthenticatedTLSAndOriginalBirthFence",
                      "TestNativeOriginClientBoundsResponsesAndRefusesUnscopedPublication",
                      "TestNativeOriginRestartRetainsCommittedWALWithReadOnlyObserver",
                      "TestNativeOriginWALMarkerRejectsCommittedForeignSchemaWithoutWrites",
                      "TestNativeOriginFaultBootstrapRefusalsCannotCreateAuthority",
                      "TestNativeOriginFaultPublicationResponseRetainsOriginalRecovery",
                      "TestNativeOriginFaultActivationRollsBackEveryDomainAndKeepsReceipt",
                      "TestNativeOriginFaultClosedOrExpiredWriterCannotActivate",
                      "TestNativeOriginFaultVerifierRejectsClosedTransaction",
                      "TestNativeOriginFaultRetainedProvenanceReadCannotMaskCorruption",
                      "TestNativeOriginFaultIntentPreviewNeverRepairsForeignMetadata",
                      "TestAgentDriverSafeConfigurationFailuresRemainRedacted",
                      "TestAgentDriverLoopSuppressesCredentialErrorsAndStopsCancelledWork",
                      "TestEmptyPythonInventoryStillRequiresAttestedSource"}
          rows = []
          for line in Path("artifacts/control-rpc-development/managed-binding-tests.jsonl").read_text().splitlines():
              try:
                  rows.append(json.loads(line))
              except json.JSONDecodeError:
                  continue
          started = {row.get("Test") for row in rows if row.get("Action") == "run" and row.get("Test") in required}
          finished = {row["Test"]: row["Action"] for row in rows if row.get("Test") in required and row.get("Action") in {"pass", "fail", "skip"}}
          code = int(os.environ["MANAGED_GO_STATUS"])
          if code == 0 and (started != required or set(finished) != required or set(finished.values()) != {"pass"}):
              code = 2
          report = {"kind": "native-managed-binding-development-v1", "sourceCommit": os.environ["GITHUB_SHA"],
                    "runId": os.environ["GITHUB_RUN_ID"], "event": os.environ["GITHUB_EVENT_NAME"], "exitCode": code,
                    "expectedTests": sorted(required), "startedExpectedTests": sorted(started), "finishedExpectedTests": finished,
                    "fullGoSuiteQualified": False, "coverageQualified": False, "fullMigrationQualified": False}
          Path("artifacts/control-rpc-development/managed-binding-result.json").write_text(json.dumps(report, indent=2)+"\n")
          raise SystemExit(code)
          PY
      - name: Verify original historical migration and rollback regressions
        env:
          CGO_ENABLED: "1"
        run: |
          python - <<'PY'
          from collections import Counter
          import json, os, re, subprocess
          from pathlib import Path
          spec = json.loads(Path("tests/native/native_origin_legacy_regressions_v1.json").read_text())
          required = set(spec["tests"])
          assert len(required) == len(spec["tests"]) == 23 and spec["originalAssertionsRetained"] is True
          pattern = "^(" + "|".join(re.escape(name) for name in sorted(required)) + ")$"
          log = Path("artifacts/control-rpc-development/legacy-migration-tests.jsonl")
          with log.open("wb") as output:
              result = subprocess.run(["go", "test", "-race", "-json", "-count=1", "-timeout=3m",
                                       "./internal/store", "-run", pattern], cwd="go", stdout=output, stderr=subprocess.STDOUT)
          started, finished = Counter(), Counter()
          packages = {}
          for line in log.read_text().splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              name, action = row.get("Test"), row.get("Action")
              if name and action == "run":
                  started[name] += 1
              if name and action in {"pass", "fail", "skip"}:
                  assert action == "pass", name
                  finished[name] += 1
              if not name and action in {"pass", "fail", "skip"}:
                  packages[row["Package"]] = action
          assert result.returncode == 0 and started == finished and all(v == 1 for v in started.values())
          assert {name for name in started if "/" not in name} == required
          assert packages == {"github.com/leizd/DeepSeek-Infra/go/internal/store": "pass"}
          Path("artifacts/control-rpc-development/legacy-migration-result.json").write_text(json.dumps({
              "status": "PASS", "sourceCommit": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
              "event": os.environ["GITHUB_EVENT_NAME"], "expectedTests": sorted(required),
              "passedTests": sorted(finished), "originalAssertionsRetained": True,
              "fullGoSuiteQualified": False, "coverageQualified": False, "fullMigrationQualified": False}, indent=2) + "\n")
          PY
      - name: Prove truncated-store refusals fail without the publication-loss guard
        env:
          CGO_ENABLED: "1"
        run: |
          negative="$RUNNER_TEMP/native-origin-negative-go"
          cp -a go "$negative"
          export NATIVE_ORIGIN_NEGATIVE_GO="$negative"
          python - <<'PY'
          import os
          from pathlib import Path
          target = Path(os.environ["NATIVE_ORIGIN_NEGATIVE_GO"]) / "internal/store/control.go"
          source = target.read_text()
          guard = '\tif nativeOrigin != nil && nativeOrigin.state.Publication != nil && !databaseExisted {\n\t\treturn nil, ErrNativeOrigin\n\t}\n'
          assert source.count(guard) == 1
          target.write_text(source.replace(guard, "", 1))
          PY
          set +e
          (cd "$negative" && go test -race -json -count=1 -timeout=2m ./internal/store -run '^TestNativeOriginRejectsTruncatedPublishedGoDatabaseWithoutRepair$') > artifacts/control-rpc-development/native-origin-negative-tests.jsonl 2>&1
          code=$?
          set -e
          export NATIVE_ORIGIN_NEGATIVE_EXIT="$code"
          python - <<'PY'
          import json, os
          from pathlib import Path
          name = "TestNativeOriginRejectsTruncatedPublishedGoDatabaseWithoutRepair"
          failed = set()
          for line in Path("artifacts/control-rpc-development/native-origin-negative-tests.jsonl").read_text().splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if row.get("Action") == "fail" and row.get("Test"):
                  failed.add(row["Test"])
          required = {name, name + "/zero-byte", name + "/empty-sqlite"}
          assert int(os.environ["NATIVE_ORIGIN_NEGATIVE_EXIT"]) == 1 and failed == required, (failed, required)
          Path("artifacts/control-rpc-development/native-origin-negative-result.json").write_text(json.dumps({
              "status": "PASS", "sourceCommit": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
              "event": os.environ["GITHUB_EVENT_NAME"], "expectedRefusalFailuresObserved": sorted(failed),
              "onlyTemporaryCopyModified": True, "fullMigrationQualified": False}, indent=2) + "\n")
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Compile Windows native launch and control surfaces in the cloud
        run: |
          cd go
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/deepseek-launch ./cmd/deepseekd
      - name: Check pure Go Android SQLite diagnostics without full-suite qualification
        if: always()
        run: |
          mkdir -p artifacts/control-rpc-development
          cd go
          set +e
          go test -tags=deepseek_android,sqlite3_flock -json -count=1 -timeout=2m ./internal/sqlitedb > ../artifacts/control-rpc-development/android-sqlite-tests.jsonl 2>&1
          go_status=$?
          set -e
          cd ..
          export CONTROL_GO_STATUS="$go_status"
          python - <<'PY'
          import json, os
          from pathlib import Path
          required = {
              "TestAndroidConnectionFailureRetainsOriginalSQLiteCauseAndNumericDiagnostic",
              "TestAndroidConnectionDiagnosticsAcceptTypedErrorCodeValuesWithoutInventingErrno",
              "TestAndroidInitializationFailureClosesRealConnectionBeforeAdmission",
              "TestAndroidMalformedFileAuthorityRejectedBeforeOpen",
              "TestAndroidUnavailableDatabaseDirectoryDoesNotCreateOrAdmitConnection",
          }
          started, finished = set(), {}
          for line in Path("artifacts/control-rpc-development/android-sqlite-tests.jsonl").read_text().splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              name, action = row.get("Test"), row.get("Action")
              if name in required and action == "run":
                  started.add(name)
              if name in required and action in {"pass", "fail", "skip"}:
                  finished[name] = action
          code = int(os.environ["CONTROL_GO_STATUS"])
          if code == 0 and (started != required or set(finished) != required or set(finished.values()) != {"pass"}):
              code = 2
          report = {"kind": "native-android-sqlite-development-v1", "sourceCommit": os.environ["GITHUB_SHA"],
                    "runId": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "event": os.environ["GITHUB_EVENT_NAME"], "ref": os.environ["GITHUB_REF"],
                    "scope": "pure Go Android-tagged SQLite host tests; not Android device execution", "exitCode": code,
                    "expectedTests": sorted(required), "startedExpectedTests": sorted(started), "finishedExpectedTests": finished,
                    "fullGoSuiteQualified": False, "coverageQualified": False, "androidDeviceQualified": False,
                    "releaseQualified": False, "fullMigrationQualified": False}
          Path("artifacts/control-rpc-development/android-sqlite-result.json").write_text(json.dumps(report, indent=2) + "\n")
          raise SystemExit(code)
          PY
      - name: Preserve development reports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-control-rpc-development-${{ github.sha }}
          path: artifacts/control-rpc-development/
          if-no-files-found: warn
          retention-days: 7
