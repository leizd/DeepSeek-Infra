name: Native control RPC development checks

on:
  push:
    branches:
      - "codex/rust-cloud/android-platform-diagnostics-*"
      - "codex/rust-cloud/control-rpc-mtls-*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: control-rpc-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      GIT_OPTIONAL_LOCKS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install the same checksum-pinned Go used by full verification
        run: |
          archive="$RUNNER_TEMP/go1.27.1.linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" https://go.dev/dl/go1.27.1.linux-amd64.tar.gz
          echo "63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/control-go"
          tar -xzf "$archive" -C "$RUNNER_TEMP/control-go"
          echo "$RUNNER_TEMP/control-go/go/bin" >> "$GITHUB_PATH"
      - name: Check native Android control file exclusion and descriptor lifetime
        timeout-minutes: 8
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p artifacts/control-rpc-development
          cd go
          set +e
          GOFLAGS=-tags=deepseek_android,sqlite3_flock go test -race -json -count=1 -timeout=5m -covermode=atomic -coverprofile=../artifacts/control-rpc-development/android-control-guard-scoped-coverage.out ./internal/sqlitedb ./internal/store ./internal/launch -run '^(TestAndroidControlGuardSurvivesReaderCloseAndBoundedDescriptorChurn|TestAndroidControlGuardReleasedOnlyAfterActualOwnerKill|TestAndroidNativeOriginRetainsProcessOwnedControlFileGuard|TestControlFileCreationNeverOverwritesAnExistingDatabase|TestControlFileNoncreatingPreparationLeavesMissingFilesAbsent|TestControlBirthRefusesTheNoncreatableOwnProcDirectory|TestAndroidControlGuardPreservesAtomicFileControlLifecycle|TestAndroidControlGuardFilesystemAdmissionRefusals|TestAndroidGuardianCustodyParsesParenthesizedNames|TestAndroidGuardianRejectsInterpreterAndForeignProcessNames|TestAndroidGuardianPrepareKeepsOnlyRootPipeAndOriginalEnvironment|TestLinuxCancelledLaunchAndInvalidGuardianPlanAdmitNoChild|TestLinuxRemovedWorkingDirectoryCannotCreateRelativeRuntimeState|TestLinuxUnavailableDescriptorBudgetFailsBeforeStartingGuardian|TestLinuxLegacyCommandAfterNativeAdmissionSettlesOwnedChildren|TestLinuxWaitForChildrenHasBoundedMissingResult)$' > ../artifacts/control-rpc-development/android-control-guard-tests.jsonl 2>&1
          guard_status=$?
          set -e
          cd ..
          export ANDROID_CONTROL_GUARD_STATUS="$guard_status"
          python - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path
          required = {"TestAndroidControlGuardSurvivesReaderCloseAndBoundedDescriptorChurn",
                      "TestAndroidControlGuardReleasedOnlyAfterActualOwnerKill",
                      "TestAndroidNativeOriginRetainsProcessOwnedControlFileGuard",
                      "TestControlFileCreationNeverOverwritesAnExistingDatabase",
                      "TestControlFileNoncreatingPreparationLeavesMissingFilesAbsent",
                      "TestControlBirthRefusesTheNoncreatableOwnProcDirectory",
                      "TestAndroidControlGuardPreservesAtomicFileControlLifecycle",
                      "TestAndroidControlGuardFilesystemAdmissionRefusals",
                      "TestAndroidGuardianCustodyParsesParenthesizedNames",
                      "TestAndroidGuardianRejectsInterpreterAndForeignProcessNames",
                      "TestAndroidGuardianPrepareKeepsOnlyRootPipeAndOriginalEnvironment",
                      "TestLinuxCancelledLaunchAndInvalidGuardianPlanAdmitNoChild",
                      "TestLinuxRemovedWorkingDirectoryCannotCreateRelativeRuntimeState",
                      "TestLinuxUnavailableDescriptorBudgetFailsBeforeStartingGuardian",
                      "TestLinuxLegacyCommandAfterNativeAdmissionSettlesOwnedChildren",
                      "TestLinuxWaitForChildrenHasBoundedMissingResult"}
          started, finished, packages = Counter(), {}, {}
          for line in Path("artifacts/control-rpc-development/android-control-guard-tests.jsonl").read_text().splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              name, action = row.get("Test"), row.get("Action")
              if name and action == "run": started[name] += 1
              if name and action in {"pass", "fail", "skip"}:
                  assert name not in finished
                  finished[name] = action
              if not name and action in {"pass", "fail", "skip"}: packages[row["Package"]] = action
          atomic_subcases = {"TestAndroidControlGuardPreservesAtomicFileControlLifecycle/" + name
                             for name in ["commit", "rollback", "close-pending", "begin-refusal", "commit-refusal", "abort-refusal", "unsupported"]}
          filesystem_subcases = {"TestAndroidControlGuardFilesystemAdmissionRefusals/" + name
                                 for name in ['missing', 'directory', 'symlink', 'existing-birth', 'shared-handles', 'hardlink', 'moved', 'custom-vfs', 'modeof', 'connection-budget']}
          all_required = required | atomic_subcases | filesystem_subcases
          code = int(os.environ["ANDROID_CONTROL_GUARD_STATUS"])
          expected_packages = {"github.com/leizd/DeepSeek-Infra/go/internal/sqlitedb": "pass",
                               "github.com/leizd/DeepSeek-Infra/go/internal/store": "pass",
                               "github.com/leizd/DeepSeek-Infra/go/internal/launch": "pass"}
          if code == 0 and (set(started) != all_required or set(finished) != all_required or
                            set(started.values()) != {1} or set(finished.values()) != {"pass"} or packages != expected_packages):
              code = 2
          result = {"sourceCommit": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
                    "event": os.environ["GITHUB_EVENT_NAME"], "exitCode": code,
                    "expectedTests": sorted(required), "finishedTests": finished,
                    "goFlags": "-tags=deepseek_android,sqlite3_flock", "raceEnabled": True,
                    "scope": "actual native store plus host independent lock/readonly peers and SIGKILL only",
                    "readerCloseIterations": 64, "physicalDescriptorGrowthBound": 2,
                    "expectedAtomicAdapterSubcases": sorted(atomic_subcases), "actualF2FSDeviceQualified": False,
                    "expectedFilesystemSubcases": sorted(filesystem_subcases),
                    "scopedCoverageProfile": "android-control-guard-scoped-coverage.out", "scopedCoverageOnly": True,
                    "actualAndroidDeviceQualified": False, "defaultAndroidAuthorityQualified": False,
                    "fullGoSuiteQualified": False, "coverageQualified": False, "fullMigrationQualified": False}
          Path("artifacts/control-rpc-development/android-control-guard-result.json").write_text(json.dumps(result, indent=2) + "\n")
          raise SystemExit(code)
          PY
      - name: Prove native control guard regression rejects premature physical close
        timeout-minutes: 5
        env:
          CGO_ENABLED: "1"
        run: |
          python - <<'PY'
          import json, os, shutil, subprocess, tempfile
          from pathlib import Path
          regression = "TestAndroidControlGuardSurvivesReaderCloseAndBoundedDescriptorChurn"
          with tempfile.TemporaryDirectory(prefix="native-guard-eager-close-") as directory:
              target = Path(directory) / "go"
              shutil.copytree("go", target)
              path = target / "internal/sqlitedb/control_file_android_flock.go"
              source = path.read_text()
              marker = "func (file *trackedControlFile) Close() error {"
              tail_marker = "\n// Connection-specific SHM"
              assert source.count(marker) == source.count(tail_marker) == 1
              before, remainder = source.split(marker)
              old, after = remainder.split(tail_marker)
              assert old.rstrip().endswith("}")
              replacement = "\n".join([
                  marker,
                  " file.closed.Do(func() {",
                  "  r := &controlFiles; r.mu.Lock(); defer r.mu.Unlock()",
                  "  if file.shm != nil { file.closeError = errors.Join(file.closeError, file.shm.Close()) }",
                  "  if file.mapper != nil { file.closeError = errors.Join(file.closeError, file.mapper.Close()) }",
                  "  file.closeError = errors.Join(file.closeError, file.slot.mapping.Close(), file.File.Close())",
                  "  entry := file.entry; entry.active--; file.slot.inUse = false",
                  "  for i, slot := range entry.slots { if slot == file.slot { entry.slots = append(entry.slots[:i], entry.slots[i+1:]...); break } }",
                  "  if entry.refs == 0 && entry.active == 0 { file.closeError = errors.Join(file.closeError, r.retire(entry)) }",
                  " })",
                  " return file.closeError",
                  "}", ""])
              path.write_text(before + replacement + tail_marker + after)
              command = ["go", "test", "-race", "-json", "-count=1", "-timeout=2m", "./internal/sqlitedb", "-run", "^" + regression + "$"]
              completed = subprocess.run(command, cwd=target, env=dict(os.environ, GOFLAGS="-tags=deepseek_android,sqlite3_flock"), stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180)
          Path("artifacts/control-rpc-development/android-control-guard-negative-tests.jsonl").write_bytes(completed.stdout)
          started, finished, packages, messages = [], [], [], []
          for line in completed.stdout.decode().splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if row.get("Test"):
                  assert row["Test"] == regression
                  if row["Action"] == "run": started.append(regression)
                  if row["Action"] in {"pass", "fail", "skip"}: finished.append(row["Action"])
                  messages.append(row.get("Output", ""))
              elif row.get("Action") in {"pass", "fail", "skip"}: packages.append(row["Action"])
          assert completed.returncode == 1 and started == [regression] and finished == packages == ["fail"]
          assert "reader close released the process-owned legacy lock" in "".join(messages)
          result = {"status": "PASS", "sourceCommit": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
                    "event": os.environ["GITHUB_EVENT_NAME"], "expectedAssertionFailuresObserved": [regression],
                    "onlyTemporaryCopyModified": True, "prematurePhysicalCloseReintroduced": True,
                    "actualAndroidDeviceQualified": False, "fullMigrationQualified": False}
          Path("artifacts/control-rpc-development/android-control-guard-negative-result.json").write_text(json.dumps(result, indent=2) + "\n")
          PY
      - name: Check actual Android-tagged process recovery and bounded lease observation
        timeout-minutes: 7
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p artifacts/control-rpc-development
          cd go
          set +e
          GOFLAGS=-tags=deepseek_android,sqlite3_flock go test -race -json -count=1 -timeout=5m ./cmd/deepseekd -run '^(TestDeepseekdKilledProcessPreservesAcknowledgedStateAndWriterFence|TestPersistedProcessLeaseObservesTemporaryAndroidContentionWithoutMutation)$' > ../artifacts/control-rpc-development/android-process-tests.jsonl 2>&1
          process_status=$?
          set -e
          cd ..
          export ANDROID_PROCESS_STATUS="$process_status"
          python - <<'PY'
          import json, os
          from pathlib import Path
          required = {"TestDeepseekdKilledProcessPreservesAcknowledgedStateAndWriterFence",
                      "TestPersistedProcessLeaseObservesTemporaryAndroidContentionWithoutMutation"}
          started, finished = set(), {}
          for line in Path("artifacts/control-rpc-development/android-process-tests.jsonl").read_text().splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              name, action = row.get("Test"), row.get("Action")
              if name in required and action == "run":
                  started.add(name)
              if name in required and action in {"pass", "fail", "skip"}:
                  assert name not in finished
                  finished[name] = action
          code = int(os.environ["ANDROID_PROCESS_STATUS"])
          if code == 0 and (started != required or set(finished) != required or set(finished.values()) != {"pass"}):
              code = 2
          report = {"sourceCommit": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
                    "event": os.environ["GITHUB_EVENT_NAME"], "exitCode": code,
                    "goFlags": "-tags=deepseek_android,sqlite3_flock", "expectedTests": sorted(required),
                    "startedExpectedTests": sorted(started), "finishedExpectedTests": finished,
                    "scope": "Android-tagged host race/process recovery; not Android device execution",
                    "androidDeviceQualified": False, "fullGoSuiteQualified": False,
                    "coverageQualified": False, "fullMigrationQualified": False}
          Path("artifacts/control-rpc-development/android-process-result.json").write_text(json.dumps(report, indent=2) + "\n")
          raise SystemExit(code)
          PY
      - name: Prove the Android lease observer regression rejects the original zero-timeout query
        timeout-minutes: 3
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p artifacts/control-rpc-development
          negative="$(mktemp -d)"
          trap 'rm -rf "$negative"' EXIT
          cp -a go "$negative/go"
          export ANDROID_OBSERVER_NEGATIVE_ROOT="$negative"
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["ANDROID_OBSERVER_NEGATIVE_ROOT"]) / "go/cmd/deepseekd/process_test.go"
          source = path.read_text()
          guarded = 'RawQuery: "mode=ro&_query_only=1&_busy_timeout=1000"'
          assert source.count(guarded) == 1
          path.write_text(source.replace(guarded, 'RawQuery: "mode=ro"'))
          PY
          set +e
          (cd "$negative/go" && GOFLAGS=-tags=deepseek_android,sqlite3_flock go test -race -json -count=1 -timeout=2m ./cmd/deepseekd -run '^TestPersistedProcessLeaseObservesTemporaryAndroidContentionWithoutMutation$') > artifacts/control-rpc-development/android-observer-negative-tests.jsonl 2>&1
          negative_status=$?
          set -e
          export ANDROID_OBSERVER_NEGATIVE_STATUS="$negative_status"
          python - <<'PY'
          import json, os
          from pathlib import Path
          name = "TestPersistedProcessLeaseObservesTemporaryAndroidContentionWithoutMutation"
          started, failed, output = [], [], []
          for line in Path("artifacts/control-rpc-development/android-observer-negative-tests.jsonl").read_text().splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if row.get("Test") == name:
                  if row.get("Action") == "run":
                      started.append(name)
                  if row.get("Action") in {"pass", "fail", "skip"}:
                      assert row["Action"] == "fail"
                      failed.append(name)
                  output.append(row.get("Output", ""))
          assert int(os.environ["ANDROID_OBSERVER_NEGATIVE_STATUS"]) == 1
          assert started == failed == [name] and "database is locked" in "".join(output)
          report = {"status": "PASS", "sourceCommit": os.environ["GITHUB_SHA"],
                    "runId": os.environ["GITHUB_RUN_ID"], "event": os.environ["GITHUB_EVENT_NAME"],
                    "expectedAssertionFailuresObserved": failed, "onlyTemporaryCopyModified": True,
                    "originalFenceAndExpiryAssertionsRetained": True, "fullMigrationQualified": False}
          Path("artifacts/control-rpc-development/android-observer-negative-result.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Check Android native guardian custody without pidfds
        timeout-minutes: 5
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p artifacts/control-rpc-development
          cd go
          set +e
          GOFLAGS=-tags=deepseek_android,sqlite3_flock go test -race -json -count=1 -timeout=3m ./internal/launch -run '^(TestAndroidGuardianRootKillCleansEscapedDescendantsWithoutPidfds|TestAndroidGuardianCoreSettlesRealExitAndCancellation|TestAndroidGuardianRefusesMissingPipeAndForeignImage)$' > ../artifacts/control-rpc-development/android-guardian-tests.jsonl 2>&1
          guardian_status=$?
          set -e
          cd ..
          export ANDROID_GUARDIAN_STATUS="$guardian_status"
          python - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path
          required = {"TestAndroidGuardianRootKillCleansEscapedDescendantsWithoutPidfds",
                      "TestAndroidGuardianCoreSettlesRealExitAndCancellation",
                      "TestAndroidGuardianRefusesMissingPipeAndForeignImage"}
          starts, terminals, packages = Counter(), {}, {}
          for line in Path("artifacts/control-rpc-development/android-guardian-tests.jsonl").read_text().splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              name, action = row.get("Test"), row.get("Action")
              if name and action == "run": starts[name] += 1
              if name and action in {"pass", "fail", "skip"}:
                  assert name not in terminals
                  terminals[name] = action
              if not name and action in {"pass", "fail", "skip"}: packages[row["Package"]] = action
          code = int(os.environ["ANDROID_GUARDIAN_STATUS"])
          if code == 0 and (set(starts) != set(terminals) or set(starts.values()) != {1} or
                            set(terminals.values()) != {"pass"} or
                            {name for name in starts if "/" not in name} != required or
                            packages != {"github.com/leizd/DeepSeek-Infra/go/internal/launch": "pass"}):
              code = 2
          report = {"sourceCommit": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
                    "event": os.environ["GITHUB_EVENT_NAME"], "exitCode": code,
                    "expectedTests": sorted(required), "finishedTests": terminals,
                    "goFlags": "-tags=deepseek_android,sqlite3_flock", "raceEnabled": True,
                    "pidfdsDeniedInActualLauncherTree": True,
                    "inheritedIgnoredSIGCHLDRetainedAsWaitableChildren": True,
                    "scope": "Android-tagged Linux host process custody with actual seccomp denial only",
                    "androidDeviceQualified": False, "allAndroidFeaturesQualified": False,
                    "fullGoSuiteQualified": False, "coverageQualified": False,
                    "fullMigrationQualified": False}
          Path("artifacts/control-rpc-development/android-guardian-result.json").write_text(json.dumps(report, indent=2) + "\n")
          raise SystemExit(code)
          PY
      - name: Prove Android guardian regression rejects the original unfenced launch
        timeout-minutes: 4
        env:
          CGO_ENABLED: "1"
        run: |
          python - <<'PY'
          import json, os, shutil, subprocess, tempfile
          from pathlib import Path
          regression = "TestAndroidGuardianRootKillCleansEscapedDescendantsWithoutPidfds"
          with tempfile.TemporaryDirectory(prefix="android-no-guardian-") as directory:
              target = Path(directory) / "go"
              shutil.copytree("go", target)
              path = target / "internal/launch/process_fence_linux.go"
              source = path.read_text()
              marker = "func (f processFence) prepare(process Process, env []string) (fencedProcess, error) {"
              assert source.count(marker) == 1 and source.rstrip().endswith("}")
              assert source.count('\t"errors"\n') == 1
              path.write_text(source.split(marker)[0].replace('\t"errors"\n', '', 1) + marker + '\n\treturn fencedProcess{path: process.Path, args: []string{process.Path}, env: env}, nil\n}\n')
              env = dict(os.environ, GOFLAGS="-tags=deepseek_android,sqlite3_flock")
              command = ["go", "test", "-race", "-json", "-count=1", "-timeout=2m", "./internal/launch", "-run", "^" + regression + "$"]
              completed = subprocess.run(command, cwd=target, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=160)
          raw = Path("artifacts/control-rpc-development/android-guardian-negative-tests.jsonl")
          raw.write_bytes(completed.stdout)
          started, finished, packages, messages = [], [], [], []
          for line in completed.stdout.decode().splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if row.get("Test"):
                  assert row["Test"] == regression
                  if row["Action"] == "run": started.append(regression)
                  if row["Action"] in {"pass", "fail", "skip"}: finished.append(row["Action"])
                  messages.append(row.get("Output", ""))
              elif row.get("Action") in {"pass", "fail", "skip"}: packages.append(row["Action"])
          assert completed.returncode == 1 and started == [regression] and finished == ["fail"] and packages == ["fail"]
          assert "survived launcher SIGKILL without pidfds" in "".join(messages)
          assert "cooperative fixture cleanup did not stop listener" not in "".join(messages)
          report = {"status": "PASS", "sourceCommit": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
                    "event": os.environ["GITHUB_EVENT_NAME"], "expectedAssertionFailuresObserved": [regression],
                    "onlyTemporaryCopyModified": True, "originalUnfencedLaunchReintroduced": True,
                    "fixtureDescendantsCooperativelyStopped": True, "androidDeviceQualified": False,
                    "fullMigrationQualified": False}
          Path("artifacts/control-rpc-development/android-guardian-negative-result.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - name: Exercise real control lifecycle regressions without release qualification
        env:
          # Go race instrumentation requires Cgo; production builds remain pure Go.
          CGO_ENABLED: "1"
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p artifacts/control-rpc-development
          cd go
          set +e
          go test -race -json -count=1 -timeout=3m -covermode=atomic -coverprofile=../artifacts/control-rpc-development/go-scoped-coverage.out ./internal/config ./internal/lifecycle ./internal/launch > ../artifacts/control-rpc-development/go-tests.jsonl 2>&1
          go_status=$?
          set -e
          cd ..
          export CONTROL_GO_STATUS="$go_status"
          python - <<'PY'
          import json, os
          from pathlib import Path
          required = {
              "TestInternalRPCRequiresCompleteLoopbackTLSAndAuthenticatedDeployment",
              "TestActualLifecycleServesMutuallyAuthenticatedRPCAndRetainsDomainRefusal",
              "TestActualLifecycleRequiresBothTrustedClientCertificateAndBearer",
              "TestActualLifecycleCancellationClosesBothListenersBeforeWriterSuccessor",
              "TestProductionRPCPlanForwardsBothTransportEndpoints",
              "TestProductionRPCPlanRejectsPartialTransportBeforeLaunch",
              "TestProductionRPCPlanIsolatesServerAndRustCustodyCredentials",
              "TestProductionRPCOptionsReachEveryChildWithRoleIsolation",
              "TestProductionRPCLocalAuthReachesEveryChildWithoutReplacingStoredToken",
              "TestProductionRPCOperatorAuthAndDisabledModeReachExistingChildrenWithoutDiskWrites",
              "TestProductionRPCOptionsScopeNilChildEnvironmentsAndDoNotMutateOriginalPlan",
              "TestManagedNativeStartupUsesAuthenticatedBindingAndRetainsWriterFence",
              "TestManagedMissingKeysNeverTriggerInitializer",
              "TestManagedProfileRejectsRedirectedPrivateDirectories",
              "TestManagedBootstrapFaultsNeverStartControlOrReplaceCustody",
              "TestManagedBootstrapRejectsCorruptMetadataBeforeInitialization",
              "TestManagedFreshnessRequiresReadableExclusiveNativeMetadata",
              "TestManagedBoundedReadsRefuseTruncationAndIOFailure",
              "TestManagedInitializerRequiresFenceAndReportsRealChildFailure",
              "TestManagedRuntimeRejectsInvalidPlansAndUnavailableBinding",
              "TestManagedProfileRequiresOriginalMetadataAndExclusiveOwner",
              "TestManagedProfileNeverRecreatesLostCustodyOrGoState",
              "TestManagedGoTransportIdentityIsBoundToOwnServer",
              "TestManagedRoleScopesAndExplicitOperatorProvisioning",
              "TestManagedExpectedWriterFenceIsExplicitAndStrict",
              "TestManagedNativeOriginRequiresPinnedAuthoritativeDeployment",
              "TestManagedControlReadinessRequiresTheExpectedLiveWriter",
              "TestManagedControlReadinessWaitsForRetainedWriterLease",
              "TestManagedPublicPinPreparationRecoversOriginalCustody",
              "TestManagedPublicPreparationNeverRepairsForeignOrLostState",
              "TestManagedPreparationCleanupRefusalPreservesControlWithoutStartingEdge",
              "TestNativeLifecycleRefusesIncompleteAuthorityBeforeCreatingStore",
              "TestNativeLifecycleOriginRPCRefusalClosesListenersWithoutPublication",
              "TestManagedDesktopKeepsItsPreparedEnvironmentPrivate",
              "TestManagedDesktopAndEdgeWaitForActualControlReadiness",
              "TestProductionAgentCredentialsAndBodyCustodyStayInRustRoles",
              "TestManagedControlReadinessRefusesForeignTargetsAndCancellation",
              "TestManagedGatewayWaitsForActualControlReadiness",
              "TestManagedLifecycleRejectsChangedWriterFenceBeforeServing",
          }
          started, finished = set(), {}
          for line in Path("artifacts/control-rpc-development/go-tests.jsonl").read_text().splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              name, action = row.get("Test"), row.get("Action")
              if name in required and action == "run":
                  started.add(name)
              if name in required and action in {"pass", "fail", "skip"}:
                  finished[name] = action
          code = int(os.environ["CONTROL_GO_STATUS"])
          if code == 0 and (started != required or set(finished) != required or set(finished.values()) != {"pass"}):
              code = 2
          report = {"kind": "native-control-rpc-development-v1", "sourceCommit": os.environ["GITHUB_SHA"],
                    "runId": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "event": os.environ["GITHUB_EVENT_NAME"], "ref": os.environ["GITHUB_REF"],
                    "scope": "complete config/lifecycle/launch packages with race detection", "exitCode": code,
                    "expectedTests": sorted(required), "startedExpectedTests": sorted(started), "finishedExpectedTests": finished,
                    "fullGoSuiteQualified": False, "coverageQualified": False, "releaseQualified": False, "fullMigrationQualified": False}
          Path("artifacts/control-rpc-development/result.json").write_text(json.dumps(report, indent=2) + "\n")
          raise SystemExit(code)
          PY
      - name: Prove original signer-pin interruption is detected without preparation admission
        env:
          CGO_ENABLED: "1"
        run: |
          python - <<'PY'
          import json, os, shutil, subprocess, tempfile
