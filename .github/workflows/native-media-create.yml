name: Native media creation compatibility
'on':
  push:
    branches:
    - codex/native-media-create-*
  workflow_dispatch: null
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: native-media-create-${{ github.ref }}
  cancel-in-progress: false
jobs:
  media-create:
    name: Actual retained media creation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      DEEPSEEK_EVIDENCE_SOURCE_CONTEXT: ${{ github.workspace }}/artifacts/native-media-create/source-context.json
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      MEDIA_GO_TEST_PATTERN: ^(TestMedia.*|TestActionAdmissionV4UpgradePreservesHistoryAndRollsBackOnFailure|TestActionReconciliationMigrationDoesNotLegalizeOldStateEdges|TestActionReconciliationV5UnknownTakeoverStillResolves|TestActionReconciliationV5UpgradePreservesHistory|TestActionVerificationUpgradeDoesNotLegalizePreV7Phases|TestActionVerificationV6UpgradeIsAtomicAndPreservesRecovery|TestControlAuthorityV7UpgradeIsAtomicAndPreservesHistory|TestControlMigratesFromV2ToOperationJournal|TestControlRPCRejectsDuplicateCredentialsAndOversizedMessages|TestCutoverJournalRejectsMutationAndControlMigratesFromV1|TestNativeOriginV18MigrationFaultRetainsOriginalSignedStore|TestOperationStatusV8UpgradePreservesTheJournal|TestReconcilingInvariantV5IllegalEdgeStaysIllegal|TestStorageDispatchV3UpgradePreservesHistoryAndFailedClaim|TestV10InventoryMigrationRetainsShadowHistoryWithoutForgingAttestation|TestV11StoreMigratesToTheHandbackSchemaWithoutInventingHistory|TestV12ImportMigratesWithoutInventingLiveSourceBinding|TestV12PromotedImportCannotUpgradeWithoutLiveSourceBinding|TestV14MigrationPreservesOlderRecordsWithoutInventingHealth|TestV15MigrationPreservesRecordsAndVerifiesTheJournal|TestV16CancellationMigrationPreservesActiveLeaseAndImmutableHistory|TestV16StoreOpenMigratesFailureLeaseAndPreservesOriginalCustody|TestV17FailureMigrationPreservesRowsThenSettlesVerifiedPhase|TestV9UnsignedPromotionHistoryCannotBeUpgradedAsSigned)$
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Keep all compiler outputs on the cloud runner
      run: 'echo "CARGO_HOME=$RUNNER_TEMP/rust-cloud-cargo" >> "$GITHUB_ENV"

        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/rust-cloud-target-checks" >> "$GITHUB_ENV"


        echo "GOCACHE=$RUNNER_TEMP/native-media-create-go-cache" >> "$GITHUB_ENV"

        '
    - name: Bind this focused probe to its exact source revision
      run: 'mkdir -p artifacts/native-media-create

        python scripts/capture_evidence_context.py --version "$(cat VERSION)" --out "$DEEPSEEK_EVIDENCE_SOURCE_CONTEXT"

        '
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Build the unchanged native frontend
      run: 'npm ci --prefix frontend

        npm run build --prefix frontend

        '
    - name: Install offline original ASGI oracle dependencies
      run: 'sudo apt-get update

        sudo apt-get install --yes --no-install-recommends strace libcap2-bin

        python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-native-protocol.txt

        python -c "from fastapi.testclient import TestClient"

        '
    - uses: dtolnay/rust-toolchain@69084b241933c14c2fa24234c4596f11a2655339
      with:
        toolchain: 1.85.0
        components: rustfmt
    - name: Restore cloud dependency archives
      id: registry
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: '${{ env.CARGO_HOME }}/registry/index

          ${{ env.CARGO_HOME }}/registry/cache

          ${{ env.CARGO_HOME }}/git/db

          '
        key: rust-cloud-v1-registry-${{ runner.os }}-1.85.0-${{ hashFiles('rust/Cargo.lock') }}
    - name: Restore compiled dependencies and test binaries in the cloud
      id: target
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ env.CARGO_TARGET_DIR }}
        key: rust-cloud-v1-target-${{ runner.os }}-1.85.0-checks-${{ hashFiles('rust/**/Cargo.toml', 'rust/Cargo.lock', 'rust/.cargo/config.toml',
          'scripts/rust_build.py', 'scripts/run_rust_coverage.py') }}-${{ github.sha }}
        restore-keys: 'rust-cloud-v1-target-${{ runner.os }}-1.85.0-checks-${{ hashFiles(''rust/**/Cargo.toml'', ''rust/Cargo.lock'', ''rust/.cargo/config.toml'',
          ''scripts/rust_build.py'', ''scripts/run_rust_coverage.py'') }}-

          '
    - name: Install the repository's checksum-pinned Go for the real signing producer
      run: 'archive="$RUNNER_TEMP/go1.27.1.linux-amd64.tar.gz"

        install_dir="$RUNNER_TEMP/agent-signing-go-1.27.1"

        curl --fail --location --silent --show-error --output "$archive" https://go.dev/dl/go1.27.1.linux-amd64.tar.gz

        echo "63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445  $archive" | sha256sum --check --strict

        mkdir -p "$install_dir"

        tar -xzf "$archive" -C "$install_dir"

        echo "$install_dir/go/bin" >> "$GITHUB_PATH"

        '
    - name: Verify Go modules before the isolated process probe
      working-directory: go
      run: 'test "$(go env GOVERSION)" = "go1.27.1"

        go mod download

        go mod verify

        '
      id: modules
    - name: Verify observer and original public create route offline
      run: 'python -m pip install mypy ruff pytest "sqlite-vec>=0.1.6,<1"

        python -m pytest tests/test_native_media_create_verifier.py tests/test_native_media_upload_verifier.py tests/test_native_media_processing_verifier.py --no-cov -p no:cacheprovider -q

        python -m mypy scripts/verify_native_media_create.py tests/test_native_media_create_verifier.py scripts/verify_native_media_upload.py tests/test_native_media_upload_verifier.py scripts/verify_native_media_processing.py tests/test_native_media_processing_verifier.py

        python -m ruff check scripts/verify_native_media_create.py tests/test_native_media_create_verifier.py scripts/verify_native_media_upload.py tests/test_native_media_upload_verifier.py scripts/verify_native_media_processing.py tests/test_native_media_processing_verifier.py

        '
    - name: Build actual production worker and edge without test hooks
      id: build
      run: 'set -o pipefail

        python scripts/rust_build.py --toolchain 1.85.0 -- build --locked -p deepseek-worker -p deepseek-gateway --bins 2>&1 | tee artifacts/native-media-create/build.log

        '
    - name: Require Rust media journal, typed registration and recovery tests
      id: media-unit
      run: 'set -o pipefail

        python scripts/rust_build.py --toolchain 1.85.0 -- test --locked -p deepseek-worker --lib media_ 2>&1 | tee artifacts/native-media-create/rust-media-tests.log

        '
    - name: Require retained source synchronization to fail closed on actual EIO
      run: 'set -o pipefail

        python scripts/verify_native_media_source_sync.py --strace /usr/bin/strace --target-dir "$CARGO_TARGET_DIR" --out artifacts/native-media-create/source-sync
        2>&1 | tee artifacts/native-media-create/source-sync.log

        '
      if: always() && steps.build.outcome == 'success'
    - name: Require all retained media and migration Go tests with the race detector
      id: admission
      run: "mkdir -p artifacts/native-media-create\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\ntest -z \"$(git status --porcelain=v1 --untracked-files=all)\"\
        \ncd go\nset +e\ngo test -race -json -count=1 -timeout=8m -covermode=atomic -coverprofile=../artifacts/native-media-create/scoped-coverage.out\
        \ ./internal/media ./internal/store ./internal/api ./internal/worker -run \"$MEDIA_GO_TEST_PATTERN\" > ../artifacts/native-media-create/go-tests.jsonl\
        \ 2>&1\ntest_status=$?\nset -e\ncd ..\nexport MEDIA_GO_STATUS=\"$test_status\"\npython - <<'PY'\nimport json, os, re, subprocess\nfrom\
        \ pathlib import Path\nexpected = set()\nfor package in [\"media\", \"store\", \"api\", \"worker\"]:\n    for path in (Path(\"go/internal\"\
        ) / package).glob(\"*_test.go\"):\n        expected.update(n for n in re.findall(r\"^func (Test\\w*)\\(\", path.read_text(), re.M) if\
        \ re.fullmatch(os.environ[\"MEDIA_GO_TEST_PATTERN\"],n))\nrequired_legacy = {'TestV15MigrationPreservesRecordsAndVerifiesTheJournal',\
        \ 'TestV14MigrationPreservesOlderRecordsWithoutInventingHealth', 'TestControlMigratesFromV2ToOperationJournal', 'TestCutoverJournalRejectsMutationAndControlMigratesFromV1',\
        \ 'TestActionAdmissionV4UpgradePreservesHistoryAndRollsBackOnFailure', 'TestActionReconciliationV5UpgradePreservesHistory', 'TestControlRPCRejectsDuplicateCredentialsAndOversizedMessages',\
        \ 'TestNativeOriginV18MigrationFaultRetainsOriginalSignedStore', 'TestV10InventoryMigrationRetainsShadowHistoryWithoutForgingAttestation',\
        \ 'TestActionReconciliationV5UnknownTakeoverStillResolves', 'TestOperationStatusV8UpgradePreservesTheJournal', 'TestActionVerificationUpgradeDoesNotLegalizePreV7Phases',\
        \ 'TestV16CancellationMigrationPreservesActiveLeaseAndImmutableHistory', 'TestReconcilingInvariantV5IllegalEdgeStaysIllegal', 'TestV16StoreOpenMigratesFailureLeaseAndPreservesOriginalCustody',\
        \ 'TestV11StoreMigratesToTheHandbackSchemaWithoutInventingHistory', 'TestActionVerificationV6UpgradeIsAtomicAndPreservesRecovery', 'TestStorageDispatchV3UpgradePreservesHistoryAndFailedClaim',\
        \ 'TestV12PromotedImportCannotUpgradeWithoutLiveSourceBinding', 'TestControlAuthorityV7UpgradeIsAtomicAndPreservesHistory', 'TestV17FailureMigrationPreservesRowsThenSettlesVerifiedPhase',\
        \ 'TestActionReconciliationMigrationDoesNotLegalizeOldStateEdges', 'TestV12ImportMigratesWithoutInventingLiveSourceBinding', 'TestV9UnsignedPromotionHistoryCannotBeUpgradedAsSigned'}\n\
        required_media = {'TestMediaAdmissionSerializesTheLibraryAndRetainsOriginalIdentity', 'TestMediaCallsRequireTheProductionSecuredWorkerChannel',\
        \ 'TestMediaControlRPCDispatchAndSignedSettlementRetainReplayIdentity', 'TestMediaControlRPCLargeTypedClaimRetainsTheOriginalLegacyMessageLimit',\
        \ 'TestMediaControlRPCRefusesBothMutationMethodsWithoutAuthority', 'TestMediaDigestBindsPresenceAndEveryIntentField', 'TestMediaDigestRejectsUnknownFieldsInvalidUTF8AndOversizedMessages',\
        \ 'TestMediaDispatchRejectsStaleClaimsAndNeverReissuesAFreshPermit', 'TestMediaForwardingPreservesTheOriginalOperationAndTransportErrors',\
        \ 'TestMediaForwardingRejectsConflictingCredentialsBeforeCallingThePeer', 'TestMediaLegacyReadRPCStillDefaultsToShadowAndRejectsMalformedSnapshots',\
        \ 'TestMediaNestedMalformedValuesCannotBypassTheTypedBoundary', 'TestMediaOutcomeRejectsMalformedAppliedObjectsAndRefusalEncoding', 'TestMediaPreparedRefusalCanSettleWithoutInventingADispatch',\
        \ 'TestMediaPublicClosedControlAndMalformedReplyRetainUncertainty', 'TestMediaPublicForgedTLSResultCannotSettleTheClaim', 'TestMediaPublicIngressKeepsHostPathDepthAndFieldPresenceChecks',\
        \ 'TestMediaPublicLostTLSReplyQueriesTheOriginalWithoutRedispatch', 'TestMediaPublicPatchKeepsAuthenticationAuthorityAndBodyRefusals',\
        \ 'TestMediaPublicTLSRefusalRetainsTheOriginalHTTPErrorAndReleasesAdmission', 'TestMediaPublicTLSRoundTripSettlesOnlyTheBoundSignedOutcome',\
        \ 'TestMediaPublicUnresolvedTLSReplyBlocksAnotherOperationDespiteAbsence', 'TestMediaRPCDoesNotAcceptAnUnauthoritativeOrUnboundRequest',\
        \ 'TestMediaRecoveryCancelsOnlyDurableUndispatchedAbsence', 'TestMediaRecoveryKeepsQueryFailuresAndIncompleteRepliesUnknown', 'TestMediaSignedHistoricalOutcomeSettlesAfterExpiryAndCannotBeChanged',\
        \ 'TestMediaSignedOutcomeCannotRebindAnOperationOrRealm', 'TestMediaStoreCorruptIntentParsingCannotEscapeItsOriginalTransaction', 'TestMediaStoreMalformedSignerCannotSettleOrRetireHistory',\
        \ 'TestMediaStoreMissingRecordsNeverInventAClaimOrSettlement', 'TestMediaStorePublicAdmissionRejectsPersistedDigestCorruption', 'TestMediaStoreShortLeaseExpiresWithoutReissuingAnOperation',\
        \ 'TestMediaStoreSignedOutcomeMustFitTheBoundIncludingItsSignature', 'TestMediaStoreUnavailableAndLostWriterFailBeforeAdmission', 'TestMediaStoreWriteAbortRollsBackTheClaimAndRetainsOnlyOnePermit',\
        \ 'TestMediaValuesRejectAmbiguousOrMalformedWireValues', 'TestMediaValuesRetainNullNumbersNestedArraysAndUnicode'}\nrequired_ordered =\
        \ {'TestMediaOrderedJSONBindsInputPositionsAndPreservesLegacyWire', 'TestMediaOrderedJSONFitsLargestPermittedPublicScalarArray', 'TestMediaOrderedJSONPreservesDuplicateFirstPositionAndRejectsMalformedInput',\
        \ 'TestMediaOrderedJSONRejectsMalformedOrdinalSets', 'TestMediaOrderedJSONRetainsCanonicalKeysAndOriginalPositions'}\nrequired_capacity\
        \ = {'TestMediaCapacityLargestLegalIntentSurvivesAdmissionAndReopen', 'TestMediaCapacityMigrationRefusesTamperedHistoryAndRetirement',\
        \ 'TestMediaCapacityMigrationRollbackRetainsExactV19Store', 'TestMediaCapacityV19UpgradeRetainsRowsAndUncertainBarrier', 'TestMediaCapacityV20SQLRetainsExactBoundsAndImmutability'}\n\
        required_recovery = {'TestMediaRecoveryDriverAbsenceAndInvalidEvidenceRetainTheBarrier', 'TestMediaRecoveryDriverCancellationDrainsTheQueryAndClosesItsClient',\
        \ 'TestMediaRecoveryDriverEmptyAndClosedStoresDoNotDialAndTicksCancel', 'TestMediaRecoveryDriverSignedRefusalSettlesWithoutDispatch',\
        \ 'TestMediaRecoveryDriverSkipsLiveClaimsAndRetiresOnlyExpiredUndispatchedAbsence', 'TestMediaRecoveryDriverStartsOnlyInTheNativeAuthoritativeLifecycle',\
        \ 'TestMediaRecoveryDriverSuccessorSettlesOriginalWithoutRedispatch', 'TestMediaRecoveryMetadataSelectsExpiryWithoutChangingTheClaim',\
        \ 'TestMediaRecoveryMetadataSelectsHistoricalWriterBeforeOriginalExpiry', 'TestMediaRecoveryMetadataSkipsPayloadDecodingUntilRecoveryIsEligible'}\n\
        required_delete = {'TestMediaDeleteIntentCannotCarryPatchOrUnknownKind', 'TestMediaDeleteSignedCountsCannotRebindPatchOrRefusal', 'TestMediaPublicDeleteAdmission',\
        \ 'TestMediaPublicDeleteTLSKeepsCountsSignedIdentityAndUnknownReservation', 'TestMediaLegacyPatchCanonicalBytesRetainDefaultKind'}\nrequired_create\
        \ = {'TestMediaCreateManifestBindsContentWithoutExpandingControlRows', 'TestMediaCreateSignedResultRequiresOriginalDigestFenceAndShape',\
        \ 'TestMediaCreationContentRequiresPinnedTLSAndServiceIdentity', 'TestMediaPublicCreateAdmission', 'TestMediaCreateForwarding', 'TestMediaCreateClientBoundedMessages', 'TestMediaPublicCreateTLS', 'TestMediaPublicCreateInputBounds', 'TestMediaMultipartParser', 'TestMediaMultipartFormCodecs', 'TestMediaMultipartPublicTLS'}\nassert\
        \ (required_legacy | required_media | required_ordered | required_capacity | required_recovery | required_delete | required_create) ==\
        \ expected\nstarted, finished, packages = {}, {}, {}\nfor line in Path(\"artifacts/native-media-create/go-tests.jsonl\").read_text().splitlines():\n\
        \    try: row = json.loads(line)\n    except json.JSONDecodeError: continue\n    name, action = row.get(\"Test\"), row.get(\"Action\"\
        )\n    if name in expected and action == \"run\": started[name] = started.get(name, 0) + 1\n    if name in expected and action in {\"\
        pass\", \"fail\", \"skip\"}:\n        assert name not in finished\n        finished[name] = action\n    if not name and action in {\"\
        pass\", \"fail\", \"skip\"}: packages[row[\"Package\"]] = action\ncode = int(os.environ[\"MEDIA_GO_STATUS\"])\nexpected_packages = {\"\
        github.com/leizd/DeepSeek-Infra/go/internal/\" + p for p in [\"media\", \"store\", \"api\", \"worker\"]}\nif code == 0 and (set(started)\
        \ != expected or set(finished) != expected or set(started.values()) != {1} or set(finished.values()) != {\"pass\"} or set(packages) !=\
        \ expected_packages or set(packages.values()) != {\"pass\"}): code = 2\ntree = subprocess.check_output([\"git\", \"rev-parse\", \"HEAD^{tree}\"\
        ], text=True).strip()\nresult = dict(status=\"PASS\" if code == 0 else \"FAIL\", sourceCommit=os.environ[\"GITHUB_SHA\"], sourceTree=tree,\
        \ runId=os.environ[\"GITHUB_RUN_ID\"], attempt=os.environ[\"GITHUB_RUN_ATTEMPT\"], event=os.environ[\"GITHUB_EVENT_NAME\"], ref=os.environ[\"\
        GITHUB_REF\"], expectedTests=sorted(expected), finishedTests=finished, packages=packages, exitCode=code, raceEnabled=True, scope=\"media\
        \ Go development regressions only; not the original full Go/Android-Go suites or coverage gates\", fullGoSuiteQualified=False, original95PercentCoverageQualified=False,\
        \ actualNativeLauncherQualified=False, authorityRecoveryQualified=False, fullMigrationQualified=False, readiness=\"NOT_READY\")\nPath(\"\
        artifacts/native-media-create/result.json\").write_text(json.dumps(result, indent=2) + \"\\n\")\nprint(json.dumps(dict(kind=\"native-media-go-gate-v1\"\
        ,status=result[\"status\"],sourceCommit=os.environ[\"GITHUB_SHA\"],runId=os.environ[\"GITHUB_RUN_ID\"],\n    goProcessExitCode=int(os.environ[\"\
        MEDIA_GO_STATUS\"]),verifierExitCode=code,expectedTests=len(expected),startedTests=len(started),finishedTests=len(finished),\n    missingTests=sorted(expected-set(started)),nonPass={n:v\
        \ for n,v in finished.items() if v!=\"pass\"},packages=packages)),flush=True)\nraise SystemExit(code)\nPY\n"
      if: always() && steps.modules.outcome == 'success'
      env:
        CGO_ENABLED: '1'
    - name: Compare actual native JSON creation with original ASGI and retained source
      run: 'set -o pipefail

        python scripts/verify_native_media_create.py --worker "$CARGO_TARGET_DIR/debug/deepseek-worker" --edge "$CARGO_TARGET_DIR/debug/deepseek-gateway"
        --verify-uploads --verify-processing --go-cache "$RUNNER_TEMP/native-media-create-go-cache" --out artifacts/native-media-create/process 2>&1 | tee artifacts/native-media-create/process.log

        '
      if: always() && steps.build.outcome == 'success'
    - name: Preserve creation reports only
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: native-media-create-${{ github.sha }}
        path: artifacts/native-media-create/
        if-no-files-found: error
        retention-days: '7'
    - name: Bound compiled cache storage after successful compilation
      id: storage
      if: always() && steps.build.outcome == 'success'
      run: 'size=$(du -sk "$CARGO_TARGET_DIR" | cut -f1)

        if [ "$size" -le 3145728 ]; then echo "eligible=true" >> "$GITHUB_OUTPUT"; else echo "eligible=false" >> "$GITHUB_OUTPUT"; fi

        '
    - name: Retain bounded compiler cache only in the cloud
      if: always() && steps.storage.outputs.eligible == 'true' && steps.target.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ env.CARGO_TARGET_DIR }}
        key: ${{ steps.target.outputs.cache-primary-key }}
