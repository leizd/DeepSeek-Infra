name: Native target registration store development

on:
  push:
    branches: ["codex/native-target-registration-store-*", "codex/native-target-location-observation-*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: native-target-registration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  registration-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the unchanged checksum-pinned Go
        run: |
          echo "GOCACHE=$RUNNER_TEMP/target-registration-go-cache" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/target-registration-go-modules" >> "$GITHUB_ENV"
          archive="$RUNNER_TEMP/go1.27.1.linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" https://go.dev/dl/go1.27.1.linux-amd64.tar.gz
          echo "63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/target-registration-go"
          tar -xzf "$archive" -C "$RUNNER_TEMP/target-registration-go"
          echo "$RUNNER_TEMP/target-registration-go/go/bin" >> "$GITHUB_PATH"
      - name: Build the exact-source v21 registration fixture producer
        timeout-minutes: 10
        run: python scripts/build_native_v21_target_fixture.py --report artifacts/native-target-registration-development/legacy-v21-producer-build.json
      - name: Compare metadata with retained CPython 3.12 functions
        run: |
          python -m pip install -r requirements.txt
          python scripts/generate_target_registration_oracle.py --report artifacts/native-target-registration-development/metadata-oracle.json
      - name: Verify the exact source and registration control transactions
        timeout-minutes: 10
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import hashlib, json, os, re, subprocess
          root=Path.cwd(); out=root/'artifacts/native-target-registration-development';out.mkdir(parents=True,exist_ok=True)
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          assert source==os.environ['GITHUB_SHA'] and not subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'])
          required={
              'TestTargetInspectionClientBindsFullContainmentAndRejectsDowngrade',
              'TestTargetMetadataPreservesKindTruthinessQuotedContainersAndNumericFormatting',
              'TestTargetMetadataRejectsBrokenBodiesBeforeAnyFilesystemWork',
              'TestTargetMetadataRetainedHTTPAndRegisterOracle',
              'TestTargetMetadataUnicodeClassificationMatchesOriginalPython312',
              'TestTargetRegistrationPublicAdmissionRefusesAuthorityAuthenticationAndInvalidInputs',
              'TestTargetRegistrationPublicAtomicFailureCannotPublishContextOrReplay',
              'TestTargetRegistrationPublicBindsEverySnapshotPathAndPreservesHistoricalSnapshot',
              'TestTargetRegistrationPublicContextCannotBeRemovedOrInjectedByOrdinaryMetadataWrites',
              'TestTargetRegistrationPublicContextRejectsMalformedFramesAndKeepsUserProjectionClean',
              'TestTargetRegistrationPublicRecoversOriginalReplyAfterExpiryDeletionAndTakeover',
              'TestTargetRegistrationPublicRejectsMissingExtraReboundExpiredAndOverlappingPaths',
              'TestTargetRegistrationPublicTCPConcurrentIdenticalRequestsCommitOnce',
              'TestTargetRegistrationPublicTCPPersistsProjectsAndRecoversWithoutAnotherRPC',
              'TestTargetRegistrationPublicTCPRejectsAbsentForgedDowngradedAndDeniedReads',
              'TestTargetRegistrationRetainsInternalHistoryAcrossOriginalPublicGenerationResets',
              'TestTargetRegistrationReplaysItsOriginalDocumentAfterDeletionAndWriterTakeover',
              'TestTargetRegistrationRejectsUnboundObservationsWithoutCommitting',
              'TestTargetRegistrationRequiresTheUnchangedRegistrySnapshot',
              'TestTargetRegistrationWitnessAndIdentityCannotBeDeletedOrReplaced',
              'TestTargetRegistrationDatabaseFailuresCannotLeavePartialPublication',
              'TestTargetRegistrationLostWitnessAndSignerPinNeverLookHealthy',
              'TestTargetRegistrationV20UpgradePreservesOldRecordsWithoutInventingWitnesses',
              'TestTargetRegistrationMalformedRequestsCannotEnterTheJournal',
              'TestTargetRegistrationQueryFailuresPreserveOriginalRowsAndReplay',
              'TestTargetRegistrationClosedTransactionsCannotMasqueradeAsMissingState',
              'TestTargetRegistrationHistoryRejectsWrongGenerationsFencesAndWitnessBytes',
              'TestTargetRegistrationMigrationInterruptionsRetainOriginalV20State',
              'TestTargetRegistrationDamagedSchemaIdentityAndCatalogNeverLookEmpty',
              'TestTargetRegistrationReplayAndPreparationCannotHideReadOrCommitFailure',
              'TestTargetRegistrationMissingOperatorOrMalformedEventCannotPublishHealthyState',
              'TestAgentDriverLoopKeepsUnknownAndToolsPendingCustodyWithoutRedispatch',
              'TestTargetInspectionClientBoundsUntrustedResponseSizes',
              'TestTargetInspectionClientNeverFallsBackToPlaintextOrDuplicateCredentials',
              'TestTargetInspectionClientReadsBothStatesWithTLSAndPinnedPublicMetadata',
              'TestTargetInspectionClientRejectsInvalidBindingsBeforeRPC',
              'TestTargetInspectionClientRejectsUnboundResponsesAndTransportFailures',
              'TestTargetLocationRejectsUnresolvedRebindingAndPurposeConfusion',
              'TestTargetLocationResolutionRequiresSignedRequestedCanonicalPath',
              'TestTargetInspectionClientBindsCanonicalResolutionAndRejectsDowngrade',
              'TestTargetObservationAcceptsSignedAbsenceWithoutAdmittingRegistration',
              'TestTargetObservationRejectsInvalidPinnedKeysAndUnencodableFields',
              'TestTargetObservationRejectsInvalidReadRequests',
              'TestTargetObservationRejectsSignedRebindingAndMalformedEnvelopes',
              'TestTargetObservationRequiresPinnedDeploymentAndFreshTime',
              'TestTargetRegistrationLocationBindingReadFailuresNeverBecomeAbsentEvidence',
              'TestTargetRegistrationLocationCannotPublishPartialWitnessOnDatabaseFailure',
              'TestTargetRegistrationLocationIsNotAnOptionalWitnessForOtherMutations',
              'TestTargetRegistrationLocationMissingOrAlteredEvidenceCannotLookHealthy',
              'TestTargetRegistrationLocationRejectsUnneededOrMalformedWitnesses',
              'TestTargetRegistrationLocationRetirementRejectsRetainedOrUnreadableCustody',
              'TestTargetRegistrationLocationSchemaReadErrorsAndOrphansFailClosed',
              'TestTargetRegistrationLocationV21UpgradePreservesOriginalBytesAndReplay',
              'TestTargetRegistrationLocationV22MigrationInterruptionsPreserveV21State',
              'TestTargetRegistrationLocationWitnessAndUpgradeBoundaryAreImmutable',
              'TestTargetRegistrationRelocationRejectsUnboundUnresolvedAndExpiredProofs',
              'TestTargetRegistrationRelocationReplaysOriginalProofAfterDeletionAndTakeover',
              'TestTargetRegistrationRelocationRequiresSignedMissingOriginalLocation',
          }
          actual=[]
          expression=r'^func (TestTarget(?:Registration|Observation|Location|Inspection|Metadata)[A-Za-z0-9_]*|TestAgentDriverLoopKeepsUnknownAndToolsPendingCustodyWithoutRedispatch)[(]'
          for package in ('store','worker','api','targets'):
              for path in (root/'go/internal'/package).glob('*_test.go'):
                  actual.extend(re.findall(expression,path.read_text(),re.M))
          assert len(actual)==len(set(actual))==len(required) and set(actual)==required
          subprocess.run(['python','scripts/capture_evidence_context.py','--version',(root/'VERSION').read_text().strip(),'--out',str(out/'source-context.json')],check=True)
          args=['go','test','-race','-json','-count=1','-timeout=8m','-covermode=atomic','-coverprofile='+str(out/'coverage.out'),'-run','^(TestTarget(Registration|Observation|Location|Inspection|Metadata)|TestAgentDriverLoopKeepsUnknownAndToolsPendingCustodyWithoutRedispatch$)','./internal/store','./internal/worker','./internal/api','./internal/targets']
          with (out/'go-tests.jsonl').open('wb') as stream:
              run=subprocess.run(args,cwd=root/'go',stdout=stream,stderr=subprocess.STDOUT,check=False)
          raw=(out/'go-tests.jsonl').read_bytes();events=[];parse_errors=[]
          for line in raw.decode('utf-8').splitlines():
              if line.startswith('{'):
                  events.append(json.loads(line))
              elif line.strip() and not re.fullmatch(r'go: downloading [A-Za-z0-9./_~+@-]+ v[0-9A-Za-z.+_-]+',line):
                  parse_errors.append(line[:200])
          top=[e for e in events if e.get('Test') and '/' not in e['Test']]
          starts=Counter(e['Test'] for e in top if e['Action']=='run')
          ends=Counter(e['Test'] for e in top if e['Action'] in {'pass','fail','skip'})
          package=[e for e in events if not e.get('Test') and e['Action'] in {'pass','fail','skip'}]
          good=run.returncode==0 and not parse_errors and set(starts)==required and starts==ends and set(starts.values())=={1}
          good=good and all(e['Action']=='pass' for e in top if e['Action'] in {'pass','fail','skip'}) and len(package)==4 and all(e['Action']=='pass' for e in package) and {e['Package'] for e in package}=={'github.com/leizd/DeepSeek-Infra/go/internal/'+p for p in ('store','worker','api','targets')}
          good=good and not any(e['Action']=='fail' or 'WARNING: DATA RACE' in e.get('Output','') for e in events)
          report=dict(status='PASS' if good else 'FAIL',sourceCommit=source,sourceTree=tree,runId=os.environ['GITHUB_RUN_ID'],event=os.environ['GITHUB_EVENT_NAME'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              expectedTests=sorted(required),command=args,exitCode=run.returncode,raceEnabled=True,timeout='8m',retainedOriginalTests=43,addedPublicAndMetadataTests=15,rawEventsSha256=hashlib.sha256(raw).hexdigest(),parseErrors=parse_errors,
              passed=sum(e['Action']=='pass' for e in top),failed=sum(e['Action']=='fail' for e in top),skipped=sum(e['Action']=='skip' for e in top),
              physicalRustInspectionQualified=False,publicRegistrationQualified=False,fullGoSuiteQualified=False,original95PercentCoverageQualified=False,fullMigrationQualified=False,readiness='NOT_READY')
          (out/'result.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({k:report[k] for k in ['status','sourceCommit','passed','failed','skipped','exitCode']}))
          if not good: raise SystemExit(1)
          PY
      - name: Return only source-bound reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-target-registration-go-${{ github.sha }}
          path: artifacts/native-target-registration-development/
          if-no-files-found: error
          retention-days: 7

  filesystem-rust:
    name: Actual Go TLS Rust filesystem observation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
      RUSTUP_TOOLCHAIN: "1.85.0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@69084b241933c14c2fa24234c4596f11a2655339
        with:
          toolchain: "1.85.0"
      - name: Keep every native output and cache in the cloud
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/rust-cloud-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/rust-filesystem-target" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
          key: rust-cloud-v1-registry-${{ runner.os }}-1.85.0-${{ hashFiles('rust/Cargo.lock') }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.CARGO_TARGET_DIR }}
          key: rust-cloud-v1-target-${{ runner.os }}-1.85.0-checks-${{ hashFiles('rust/**/Cargo.toml', 'rust/Cargo.lock', 'rust/.cargo/config.toml', 'scripts/rust_build.py', 'scripts/run_rust_coverage.py') }}-${{ github.sha }}
          restore-keys: |
            rust-cloud-v1-target-${{ runner.os }}-1.85.0-checks-${{ hashFiles('rust/**/Cargo.toml', 'rust/Cargo.lock', 'rust/.cargo/config.toml', 'scripts/rust_build.py', 'scripts/run_rust_coverage.py') }}-
      - name: Install the unchanged checksum-pinned Go
        run: |
          echo "GOCACHE=$RUNNER_TEMP/target-registration-go-cache" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/target-registration-go-modules" >> "$GITHUB_ENV"
          archive="$RUNNER_TEMP/go1.27.1.linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" https://go.dev/dl/go1.27.1.linux-amd64.tar.gz
          echo "63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/target-registration-go"
          tar -xzf "$archive" -C "$RUNNER_TEMP/target-registration-go"
          echo "$RUNNER_TEMP/target-registration-go/go/bin" >> "$GITHUB_PATH"
      - name: Bind read observations to the exact uploaded source
        run: |
          mkdir -p artifacts/native-target-filesystem-development
          python scripts/capture_evidence_context.py --version "$(cat VERSION)" --out artifacts/native-target-filesystem-development/source-context.json
      - name: Exercise native non-strict filesystem resolution
        run: |
          set -o pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p deepseek-worker --lib target_path_resolution -- --nocapture 2>&1 | tee artifacts/native-target-filesystem-development/rust-path-tests.log
          cargo test --locked --manifest-path rust/Cargo.toml -p deepseek-worker --lib target_full_containment -- --nocapture 2>&1 | tee artifacts/native-target-filesystem-development/rust-containment-tests.log
          cargo build --locked --manifest-path rust/Cargo.toml -p deepseek-worker --bin deepseek-worker
      - name: Verify the real Go TLS Rust custody path and retained Python oracle
        timeout-minutes: 4
        run: |
          set -o pipefail
          export DEEPSEEK_TEST_RUST_WORKER_BINARY="$CARGO_TARGET_DIR/debug/deepseek-worker"
          export DEEPSEEK_TEST_TARGET_EXTERNAL_ROOT="$RUNNER_TEMP"
          cd go
          go test -tags=integration -race -json ./internal/worker -run '^TestRustTargetObservationGoClientAgainstRealCustodyAndFilesystem$' -count=1 -timeout=3m 2>&1 | tee ../artifacts/native-target-filesystem-development/go-rust-tests.jsonl
      - name: Return only exact-source observation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-target-filesystem-${{ github.sha }}
          path: artifacts/native-target-filesystem-development/
          if-no-files-found: error
          retention-days: 7
