name: Native Go race shards

on:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string

permissions:
  contents: read

jobs:
  race:
    name: ${{ inputs.variant }} race (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        group: [store-a, store-b, api-a, api-b, other]
    env:
      GOTOOLCHAIN: local
      GOSUMDB: sum.golang.org
      CGO_ENABLED: "1"
      GOFLAGS: ${{ inputs.variant == 'android' && '-tags=deepseek_android,sqlite3_flock' || '' }}
      GO_RACE_VARIANT: ${{ inputs.variant }}
      GO_RACE_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checksum-pinned Go 1.27.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/go1.27.1.linux-amd64.tar.gz"
          install_dir="$RUNNER_TEMP/go-1.27.1"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://go.dev/dl/go1.27.1.linux-amd64.tar.gz
          echo "63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir/go/bin" >> "$GITHUB_PATH"
      - run: test "$(go env GOVERSION)" = "go1.27.1"
      - name: Run assigned Go race tests
        run: >-
          python -m scripts.run_native_go_race_matrix
          --variant "$GO_RACE_VARIANT"
          --group "$GO_RACE_GROUP"
          --out artifacts/go-race/group
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-race-shard-${{ inputs.variant }}-${{ matrix.group }}
          path: artifacts/go-race/group/
          if-no-files-found: error
          retention-days: 7
