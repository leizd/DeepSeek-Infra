syntax = "proto3";

package deepseek.agent.v1;

import "common/v1/common.proto";

option go_package = "github.com/leizd/DeepSeek-Infra/go/internal/protocol/agentv1;agentv1";

message AgentTaskCommand {
  deepseek.common.v1.ActionFence fence = 1;
  string task_id = 2;
  repeated string depends_on = 3;
}

message AgentTaskResult {
  deepseek.common.v1.ActionFence fence = 1;
  deepseek.common.v1.EffectState state = 2;
  string task_id = 3;
}

// Pure scheduling for the interactive chat path. This service does not create
// durable runs, authorize effects, or write a store. Durable task commands keep
// their ActionFence above. Both services share deepseekd's authenticated listener.
enum AgentChatPhase {
  AGENT_CHAT_PHASE_UNSPECIFIED = 0;
  AGENT_CHAT_PHASE_WORKERS = 1;
  AGENT_CHAT_PHASE_REVISION = 2;
  AGENT_CHAT_PHASE_SYNTHESIS = 3;
}

message AgentChatTask {
  string role = 1;
  string task = 2;
  repeated string depends_on = 3;
  uint32 attempt = 4;
}

message AgentChatOutcome {
  string role = 1;
  uint64 tokens = 2;
  bool failed = 3;
  bool retryable = 4;
  bool revision = 5;
}

message AgentChatScheduleInput {
  repeated AgentChatTask candidates = 1;
  repeated AgentChatOutcome outcomes = 2;
  string revision_target = 3;
}

message AgentChatScheduleOutput {
  repeated AgentChatTask plan = 1;
  repeated AgentChatTask execute = 2;
  repeated string completed_roles = 3;
  AgentChatPhase phase = 4;
  uint64 token_limit = 5;
  uint64 used_tokens = 6;
  uint64 timeout_seconds = 7;
  bool budget_exhausted = 8;
  bool authoritative = 9;
}

service AgentChatScheduler {
  rpc Evaluate(AgentChatScheduleInput) returns (AgentChatScheduleOutput);
}

// These references identify immutable bytes owned by Rust. They are metadata,
// not effect proofs or execution grants.
message AgentArtifactReference {
  string sha256 = 1;
  uint64 length = 2;
}

message AgentRunPlanNode {
  string id = 1;
  string task = 2;
  repeated string depends_on = 3;
}

message AgentRunEventMetadata {
  deepseek.common.v1.ActionFence fence = 1;
  string run_id = 2;
  int64 index = 3;
  string created_at = 4;
  string type = 5;
  string phase = 6;
  string status = 7;
  string scope = 8;
  repeated AgentRunPlanNode plan = 9;
  bool has_plan = 10;
  bool failed = 11;
  optional int64 duration_ms = 12;
  uint64 prompt_tokens = 13;
  uint64 completion_tokens = 14;
  AgentArtifactReference body = 15;
}

message AgentRunCreateMetadata {
  string preset = 1;
  bool confirm_plan = 2;
  string conversation_id = 3;
  string message_id = 4;
  AgentArtifactReference request = 5;
}

message AgentRunNodeMetadata {
  string id = 1;
  string state = 2;
  uint64 attempts = 3;
  optional int64 latency_ms = 4;
  uint64 prompt_tokens = 5;
  uint64 completion_tokens = 6;
  bool failed = 7;
}

message AgentRunSnapshot {
  string run_id = 1;
  string status = 2;
  int64 next_index = 3;
  string preset = 4;
  bool confirm_plan = 5;
  string conversation_id = 6;
  string message_id = 7;
  AgentArtifactReference request = 8;
  repeated AgentRunPlanNode plan = 9;
  repeated AgentRunNodeMetadata nodes = 10;
  int64 final_after = 11;
  AgentRunEventMetadata last_event = 12;
}

message AppendAgentRunEventRequest {
  uint32 schema_version = 1;
  string operation_id = 2;
  string actor = 3;
  string run_id = 4;
  int64 expected_index = 5;
  AgentRunCreateMetadata create = 6;
  AgentRunEventMetadata event = 7;
  // The current Go domain epoch, obtained from GetAuthority, must match inside
  // the write transaction. This is a metadata fence, not a worker effect grant.
  deepseek.common.v1.ActionFence fence = 8;
}

message AppendAgentRunEventResponse {
  bool already_applied = 1;
  AgentRunEventMetadata event = 2;
  AgentRunSnapshot run = 3;
}

message GetAgentRunRequest {
  string run_id = 1;
  deepseek.common.v1.ActionFence fence = 2;
}
message GetAgentRunResponse {
  bool authoritative = 1;
  AgentRunSnapshot run = 2;
}

message AgentRunEventsRequest {
  string run_id = 1;
  int64 after = 2;
  uint32 limit = 3;
  deepseek.common.v1.ActionFence fence = 4;
}
message AgentRunEventsResponse {
  bool authoritative = 1;
  repeated AgentRunEventMetadata events = 2;
}

// Read-only discovery of metadata authority. The epoch cannot authorize a
// provider effect or substitute for an action claim/lease.
message AgentRunAuthorityInput {}
message AgentRunAuthorityOutput {
  bool authoritative = 1;
  uint64 metadata_epoch = 2;
}

// Durable execution admission is separate from metadata append. A returned
// lease does not install a Rust epoch or prove a provider effect. A takeover's
// reconciliation_required flag prohibits another fresh dispatch.
enum AgentRunExecutionPhase {
  AGENT_RUN_EXECUTION_PHASE_UNSPECIFIED = 0;
  AGENT_RUN_EXECUTION_PHASE_PLAN = 1;
  AGENT_RUN_EXECUTION_PHASE_TASKS = 2;
}

message AgentRunExecutionClaim {
  deepseek.common.v1.ActionFence fence = 1;
  string run_id = 2;
  AgentRunExecutionPhase phase = 3;
  AgentArtifactReference request = 4;
  string plan_digest = 5;
  int64 metadata_index = 6;
  uint64 metadata_epoch = 7;
  string owner = 8;
  string claim_token = 9;
  int64 lease_until = 10;
  int64 claim_revision = 11;
  int64 writer_fencing_token = 12;
  int64 writer_lease_until = 13;
  string state = 14;
  bool reconciliation_required = 15;
}

message ClaimAgentRunExecutionRequest {
  uint32 schema_version = 1;
  string operation_id = 2;
  string actor = 3;
  string run_id = 4;
  AgentRunExecutionPhase phase = 5;
  int64 expected_index = 6;
  deepseek.common.v1.ActionFence metadata_fence = 7;
  string owner = 8;
  uint32 lease_seconds = 9;
}

message ClaimAgentRunExecutionResponse {
  bool already_applied = 1;
  AgentRunExecutionClaim claim = 2;
}

message RenewAgentRunExecutionRequest {
  deepseek.common.v1.ActionFence fence = 1;
  string run_id = 2;
  string owner = 3;
  string claim_token = 4;
  uint32 lease_seconds = 5;
}

message RenewAgentRunExecutionResponse {
  AgentRunExecutionClaim claim = 1;
}

// Authenticated Go control metadata only. Rust retains event/request bodies;
// fenced worker execution and effect reconciliation are separate commands.
service AgentRunControl {
  rpc GetAuthority(AgentRunAuthorityInput) returns (AgentRunAuthorityOutput);
  rpc AppendEvent(AppendAgentRunEventRequest) returns (AppendAgentRunEventResponse);
  rpc GetRun(GetAgentRunRequest) returns (GetAgentRunResponse);
  rpc EventsAfter(AgentRunEventsRequest) returns (AgentRunEventsResponse);
  rpc ClaimExecution(ClaimAgentRunExecutionRequest) returns (ClaimAgentRunExecutionResponse);
  rpc RenewExecution(RenewAgentRunExecutionRequest) returns (RenewAgentRunExecutionResponse);
}
