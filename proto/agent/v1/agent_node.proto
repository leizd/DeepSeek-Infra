syntax = "proto3";

package deepseek.agent.v1;

import "agent/v1/agent.proto";
import "common/v1/common.proto";

option go_package = "github.com/leizd/DeepSeek-Infra/go/internal/protocol/agentv1;agentv1";

// A Go-owned reservation is not a provider receipt. Its fence and immutable
// task come from the admitted run, rather than the dispatch caller.
message AgentNodeDispatchIntent {
  uint32 schema_version = 1;
  string operation_id = 2;
  deepseek.common.v1.ActionFence fence = 3;
  string run_id = 4;
  string node_id = 5;
  AgentRunExecutionPhase phase = 6;
  string task = 7;
  repeated string depends_on = 8;
  AgentArtifactReference request = 9;
  string plan_digest = 10;
  int64 metadata_index = 11;
  uint64 metadata_epoch = 12;
  string state = 13;
  int64 recorded_at = 14;
}

message BeginAgentNodeDispatchRequest {
  uint32 schema_version = 1;
  string operation_id = 2;
  string actor = 3;
  deepseek.common.v1.ActionFence fence = 4;
  string run_id = 5;
  string node_id = 6;
  string owner = 7;
  string claim_token = 8;
}

message BeginAgentNodeDispatchResponse {
  // Only the first committed reservation can be fresh. A lost response, a new
  // operation ID or a takeover must never authorize a second provider call.
  bool fresh = 1;
  AgentNodeDispatchIntent intent = 2;
  AgentRunExecutionClaim claim = 3;
}

message GetAgentNodeDispatchRequest {
  deepseek.common.v1.ActionFence fence = 1;
  string run_id = 2;
  string node_id = 3;
}

message GetAgentNodeDispatchResponse {
  // Absence is not a NOT_APPLIED remote effect proof or a dispatch permission.
  bool found = 1;
  AgentNodeDispatchIntent intent = 2;
  AgentNodeOutcomeReceipt outcome_receipt = 3;
}

// A recorded proof never grants dispatch, marks a phase complete, or releases locks.
message RecordAgentNodeOutcomeRequest {
  uint32 schema_version = 1;
  string operation_id = 2;
  string actor = 3;
  deepseek.common.v1.ActionFence fence = 4;
  string run_id = 5;
  string node_id = 6;
  AgentNodeOutcomeReceipt outcome_receipt = 7;
}

message RecordAgentNodeOutcomeResponse {
  bool already_recorded = 1;
  string receipt_sha256 = 2;
}

// Reuses deepseekd's authenticated control listener, writer and action leases.
// Rust owns a separate effect journal, provider execution and outcome proof.
service AgentNodeControl {
  rpc BeginDispatch(BeginAgentNodeDispatchRequest) returns (BeginAgentNodeDispatchResponse);
  rpc GetDispatch(GetAgentNodeDispatchRequest) returns (GetAgentNodeDispatchResponse);
  rpc RecordOutcome(RecordAgentNodeOutcomeRequest) returns (RecordAgentNodeOutcomeResponse);
}

message ExecuteAgentPlanRequest {
  uint32 schema_version = 1;
  string operation_id = 2;
  string actor = 3;
  AgentRunExecutionClaim claim = 4;
  bytes signed_phase_grant = 5;
  deepseek.common.v1.ActionFence fence = 6;
}

message AgentNodeEffectMetadata {
  string operation_id = 1;
  deepseek.common.v1.ActionFence fence = 2;
  string run_id = 3;
  string node_id = 4;
  string state = 5;
  // Scheduling references only; request/response bodies never enter Go.
  AgentArtifactReference public_event = 6;
  string outcome_sha256 = 7;
  uint64 outcome_length = 8;
  AgentNodeOutcomeReceipt outcome_receipt = 9;
}

// This signed payload is constructed from a confirmed Rust journal row. It is
// historical effect evidence, not permission to dispatch or a Go status flag.
message AgentNodeOutcomeEvidence {
  uint32 schema_version = 1;
  deepseek.common.v1.ActionFence fence = 2;
  string operation_id = 3;
  string run_id = 4;
  string node_id = 5;
  AgentRunExecutionPhase phase = 6;
  AgentArtifactReference request = 7;
  string plan_digest = 8;
  int64 metadata_index = 9;
  uint64 metadata_epoch = 10;
  int64 writer_fencing_token = 11;
  string created_at = 12;
  string confirmed_at = 13;
  string outcome_sha256 = 14;
  uint64 outcome_length = 15;
  AgentArtifactReference public_event = 16;
  repeated AgentRunPlanNode provider_plan = 17;
  string fleet_id = 18;
  string environment = 19;
}

// Signature covers the canonical protobuf encoding of evidence with the fixed
// deepseek-infra:agent-node-outcome-proof-v1 domain. Private keys stay in Rust.
message AgentNodeOutcomeReceipt {
  uint32 schema_version = 1;
  AgentNodeOutcomeEvidence evidence = 2;
  bytes signature = 3;
  string signer_public_key = 4;
}

message QueryAgentNodeEffectRequest {
  string operation_id = 1;
  deepseek.common.v1.ActionFence fence = 2;
  string run_id = 3;
  string node_id = 4;
}

message QueryAgentNodeEffectResponse {
  // Absence never authorizes another provider request.
  bool found = 1;
  AgentNodeEffectMetadata effect = 2;
}

// Actual planner I/O and outcome custody are in the production Rust worker.
// A known result is not Go phase settlement; independent proof is required.
service AgentNodeWorker {
  rpc ExecutePlan(ExecuteAgentPlanRequest) returns (AgentNodeEffectMetadata);
  rpc QueryEffect(QueryAgentNodeEffectRequest) returns (QueryAgentNodeEffectResponse);
}
