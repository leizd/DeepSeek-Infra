syntax = "proto3";

package deepseek.media.v1;

import "common/v1/common.proto";

option go_package = "github.com/leizd/DeepSeek-Infra/go/internal/protocol/mediav1;mediav1";

// Media metadata is an explicitly typed value tree, never an opaque JSON RPC
// payload. Members are unique and sorted by UTF-8 key bytes. Number spelling is
// a validated JSON decimal, avoiding float/map canonicalization ambiguity.
message MediaValue {
  oneof kind {
    bool null_value = 1; // Must be true when selected.
    bool bool_value = 2;
    string text_value = 3;
    string number_value = 4;
    MediaObject object_value = 5;
    MediaArray array_value = 6;
  }
}

message MediaMember {
  string key = 1;
  MediaValue value = 2;
  // One-based position in the original JSON object, independent of wire key
  // ordering. All zero retains legacy sorted-key semantics; otherwise the
  // object's ordinals must be a permutation of 1..member_count.
  uint32 source_ordinal = 3;
}

message MediaObject {
  repeated MediaMember members = 1;
}

message MediaArray {
  repeated MediaValue values = 1;
}

// Message presence retains the HTTP patch's absent versus explicit null
// semantics. Only the three supported public fields cross this boundary.
message MediaPatch {
  MediaValue title = 1;
  MediaValue project_id = 2;
  MediaValue metadata = 3;
}

// The v1 envelope retains its original name so stored PATCH receipts and their
// canonical request bytes remain valid. An unspecified kind is valid only for
// the existing PATCH envelope with its required patch message; it cannot imply
// DELETE. New deletion requests select an explicit non-default kind.
enum MediaMutationKind {
  MEDIA_MUTATION_KIND_UNSPECIFIED = 0;
  MEDIA_MUTATION_KIND_DELETE = 1;
  MEDIA_MUTATION_KIND_CREATE = 2;
}

message MediaPatchIntent {
  uint32 schema_version = 1;
  string operation_id = 2;
  string media_id = 3;
  MediaPatch patch = 4;
  MediaMutationKind kind = 5;
  // Only CREATE. The controller retains the content binding; payload bytes
  // remain in Rust custody and do not enlarge historical control rows.
  MediaCreateManifest create = 6;
}

// Go owns every lease/fence field. Rust obtains this claim from its own pinned,
// authenticated Go connection, not from the execution caller's supplied state.
message MediaPatchClaim {
  uint32 schema_version = 1;
  MediaPatchIntent intent = 2;
  deepseek.common.v1.ActionFence fence = 3;
  bytes request_sha256 = 4;
  string owner = 5;
  string claim_token = 6;
  int64 writer_fencing_token = 7;
  int64 lease_until_unix = 8;
  string state = 9;
  string fleet_id = 10;
  string environment = 11;
}

message GetMediaPatchClaimRequest {
  uint32 schema_version = 1;
  string operation_id = 2;
  deepseek.common.v1.ActionFence fence = 3;
}

message BeginMediaPatchDispatchRequest {
  uint32 schema_version = 1;
  string operation_id = 2;
  deepseek.common.v1.ActionFence fence = 3;
  string claim_token = 4;
  int64 writer_fencing_token = 5;
  bytes preparation_sha256 = 6;
}

message MediaPatchDispatchPermit {
  MediaPatchClaim claim = 1;
  bytes preparation_sha256 = 2;
  bool fresh = 3;
}

enum MediaPatchEffectState {
  MEDIA_PATCH_EFFECT_STATE_UNSPECIFIED = 0;
  MEDIA_PATCH_EFFECT_STATE_PREPARED = 1;
  MEDIA_PATCH_EFFECT_STATE_APPLYING = 2;
  MEDIA_PATCH_EFFECT_STATE_APPLIED = 3;
  MEDIA_PATCH_EFFECT_STATE_REFUSED = 4;
  MEDIA_PATCH_EFFECT_STATE_UNKNOWN = 5;
}

// A signed Rust outcome is evidence only. It cannot create a Go claim, advance
// an epoch, authorize another write or settle an unrelated operation.
message MediaPatchOutcome {
  uint32 schema_version = 1;
  string operation_id = 2;
  deepseek.common.v1.ActionFence original_fence = 3;
  bytes request_sha256 = 4;
  MediaPatchEffectState state = 5;
  MediaObject media = 6;
  uint32 http_status = 7;
  string error_code = 8;
  string error_message = 9;
  bytes before_sha256 = 10;
  bytes after_sha256 = 11;
  bytes signature = 12;
  string fleet_id = 13;
  string environment = 14;
  int64 writer_fencing_token = 15;
  // DELETE applies to a single original record: zero or one. PATCH and every
  // refused/unknown result must keep this field zero.
  uint32 deleted_count = 16;
  // Only a successfully applied CREATE. The original public record is retained
  // separately in Rust custody; its exact typed bytes are signed here.
  MediaCreatedResult created = 17;
}

message MediaCreateManifest {
  bytes payload_sha256 = 1;
  uint64 payload_bytes = 2;
}

message MediaCreatePayload {
  MediaObject registration = 1;
  // Exactly one of registration/upload must be present. The absent upload field
  // leaves every existing JSON registration payload and content digest intact.
  MediaUploadPayload upload = 2;
}

// One original multipart file. Go retains only the signed content binding in its
// control rows; these bytes cross the existing fenced Stage stream and remain
// in Rust custody. HTTP multipart parsing/order and processing coordination stay
// outside this message. No caller-selected filesystem path or OCR key is stored.
message MediaUploadPayload {
  string filename = 1;
  string content_type = 2;
  string project_id = 3;
  string title = 4;
  bytes data = 5;
}

message MediaCreatedResult {
  bytes record_sha256 = 1;
  uint64 record_bytes = 2;
  bytes preparation_sha256 = 3;
  deepseek.common.v1.ActionFence original_fence = 4;
}

// Durable Rust-local preparation. Source bytes are actual media file contents,
// never an opaque JSON business request. This record is not a Go authority.
message MediaCreatePreparation {
  MediaObject record = 1;
  string source_suffix = 2;
  bytes source_bytes = 3;
  // Rust-only, content-bound preparation. Absent retains every historical
  // preparation byte/hash; callers cannot supply this through the Stage API.
  MediaProcessingPreparation processing = 4;
}

// Prepared media processing effects, not an execution permit. The existing
// original action/epoch, Go dispatch permit and Rust journal still authorize
// every publication. Private index/segment effects must complete before the
// signed terminal outcome; an unresolved effect cannot imply a new operation.
message MediaProcessingPreparation {
  uint32 schema_version = 1;
  MediaObject processing_record = 2;
  MediaArray segments = 3;
  repeated MediaIndexItem index_items = 4;
  bool index_enabled = 5;
  string index_backend = 6;
  uint32 embedding_dimensions = 7;
  bool force = 8;
  // The final record is MediaCreatePreparation.record, including a retained
  // failed record when processing itself fails. Public errors are distinct
  // from claiming no effect; their implementation must retain that distinction.
  uint32 final_http_status = 9;
  string final_error_code = 10;
  string final_error_message = 11;
}

// Exact legacy rag_items projection in Rust custody. Embeddings use the frozen
// f64 little-endian representation; metadata remains an explicitly typed tree.
// No private key, API credential, caller-selected path or SQL statement crosses
// this preparation boundary.
message MediaIndexItem {
  string item_id = 1;
  string collection = 2;
  string source_id = 3;
  string project_id = 4;
  uint32 chunk_index = 5;
  string name = 6;
  string kind = 7;
  string scope = 8;
  string text = 9;
  bytes embedding_f64le = 10;
  MediaObject metadata = 11;
  int64 updated_at_millis = 12;
  sint64 vector_id = 13;
}

message MediaCreateStageRequest {
  uint32 schema_version = 1;
  string operation_id = 2;
  deepseek.common.v1.ActionFence fence = 3;
  oneof part {
    MediaCreateManifest manifest = 4;
    bytes chunk = 5;
  }
}

message MediaCreateStageResponse {
  MediaCreateManifest manifest = 1;
}

message ReadMediaCreateResultRequest {
  uint32 schema_version = 1;
  string operation_id = 2;
  deepseek.common.v1.ActionFence original_fence = 3;
}

message ReadMediaCreateResultResponse {
  MediaObject media = 1;
}

message RecordMediaPatchOutcomeRequest {
  uint32 schema_version = 1;
  MediaPatchOutcome outcome = 2;
  deepseek.common.v1.ActionFence fence = 3;
}

message RecordMediaPatchOutcomeResponse {
  bool already_recorded = 1;
}

message ExecuteMediaPatchRequest {
  uint32 schema_version = 1;
  string operation_id = 2;
  deepseek.common.v1.ActionFence fence = 3;
}

message ExecuteMediaDeleteRequest {
  uint32 schema_version = 1;
  string operation_id = 2;
  deepseek.common.v1.ActionFence fence = 3;
}

message QueryMediaPatchRequest {
  uint32 schema_version = 1;
  string operation_id = 2;
  deepseek.common.v1.ActionFence original_fence = 3;
}

message QueryMediaPatchResponse {
  // Absence is not proof of an unapplied effect or permission to retry.
  bool found = 1;
  MediaPatchOutcome outcome = 2;
}

service MediaMutationControl {
  rpc GetClaim(GetMediaPatchClaimRequest) returns (MediaPatchClaim);
  rpc BeginDispatch(BeginMediaPatchDispatchRequest) returns (MediaPatchDispatchPermit);
  rpc RecordOutcome(RecordMediaPatchOutcomeRequest) returns (RecordMediaPatchOutcomeResponse);
}

service MediaMutationWorker {
  rpc ExecutePatch(ExecuteMediaPatchRequest) returns (MediaPatchOutcome);
  rpc ExecuteDelete(ExecuteMediaDeleteRequest) returns (MediaPatchOutcome);
  rpc ExecuteCreate(ExecuteMediaPatchRequest) returns (MediaPatchOutcome);
  rpc QueryPatch(QueryMediaPatchRequest) returns (QueryMediaPatchResponse);
}

// Separate media-content transport. Existing PATCH/DELETE/control RPC limits,
// canonical encodings, signing domain and SQLite row bounds stay unchanged.
service MediaCreationPayloads {
  rpc Stage(stream MediaCreateStageRequest) returns (MediaCreateStageResponse);
  rpc ReadResult(ReadMediaCreateResultRequest) returns (ReadMediaCreateResultResponse);
}
