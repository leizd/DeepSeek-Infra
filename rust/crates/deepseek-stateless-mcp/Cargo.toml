[package]
name = "deepseek-stateless-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum = { workspace = true }
getrandom = "=0.2.17"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }

# Existing locked libc, also supported by the oldest Android subreaper path.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "=0.2.186"

# Promote the existing locked SDK binding; no new package/version is introduced.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[[bin]]
name = "deepseek-stateless-mcp"
path = "src/main.rs"
