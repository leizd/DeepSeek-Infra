[package]
name = "deepseek-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
deepseek-core = { path = "../deepseek-core" }
deepseek-mcp = { path = "../deepseek-mcp" }
deepseek-policy = { path = "../deepseek-policy" }
deepseek-rag = { path = "../deepseek-rag" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "signal", "sync"] }
axum = { workspace = true }
async-stream = "0.3"
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
blake2 = { workspace = true }
percent-encoding = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "stream", "blocking"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true }
tower = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
