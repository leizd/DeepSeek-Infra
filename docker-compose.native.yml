# DeepSeek Infra 5.0 Native Runtime Topology
# Services: deepseek-edge (Rust), deepseekd (Go), deepseek-worker (Rust).
services:
  deepseek-edge:
    build:
      context: .
      dockerfile: rust/Dockerfile
      target: gateway
    image: deepseek-edge:5.0.0
    environment:
      GATEWAY_BIND_ADDR: 0.0.0.0:8000
      GO_CONTROL_ADDR: http://deepseekd:8090
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - deepseekd
    restart: unless-stopped

  deepseekd:
    build:
      context: ./go
      dockerfile: Dockerfile
    image: deepseekd:5.0.0
    environment:
      DEEPSEEKD_LISTEN: 0.0.0.0:8090
      DEEPSEEKD_MODE: shadow
      DEEPSEEKD_OWNER: deepseekd-compose-shadow
      DEEPSEEKD_SHADOW_STORE: /data/go-control
    volumes:
      - deepseek-control:/data/go-control
    restart: unless-stopped

  deepseek-worker:
    build:
      context: .
      dockerfile: rust/Dockerfile
      target: worker
    image: deepseek-worker:5.0.0
    environment:
      # Plaintext gRPC remains loopback-only until an authenticated authority
      # synchronization channel is selected and implemented.
      DEEPSEEK_WORKER_LISTEN: 127.0.0.1:50052
    read_only: true
    restart: unless-stopped

volumes:
  deepseek-control:
