<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Browser Fixture Controls</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #tall { height: 3000px; }
  </style>
</head>
<body>
  <main>
    <h1>Browser Fixture Controls</h1>
    <label for="colour">Colour
      <select id="colour" name="colour">
        <option value="red">Red</option>
        <option value="green">Green</option>
        <option value="blue">Blue</option>
      </select>
    </label>
    <p id="chosen">none</p>
    <div id="tall"></div>
    <a id="top-link" href="#top">Back to top</a>
  </main>
  <script>
    document.querySelector("#colour").addEventListener("change", (event) => {
      document.querySelector("#chosen").textContent = event.target.value;
    });
  </script>
</body>
</html>
