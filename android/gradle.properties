android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Maven Central rate-limits this runner's cold-start burst of parallel requests
# with `429 Too Many Requests`, which surfaces as an unroutable dependency rather
# than a retryable failure: Gradle records the artifact as missing and then
# reports "Could not find <artifact>" with no HTTP status in its own message.
#
# These raise both HTTP timeouts above Gradle's defaults (30s connect, 30s
# socket) so a slow or throttled response has room to complete. They are the only
# transport knobs Gradle 8 exposes as system properties - there is no property
# for retry count or for the number of concurrent connections, so the real fix is
# to stop re-fetching the plugin classpath on every run, which the workflow now
# does by enabling the Gradle User Home cache.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
